      if(R.missing.length)throw new Error("資料不一致（找不到要刪除的局），已停止");
      const bid=Math.max(0,...UPL.b.map(b=>num0(b.id)))+1,tf=`del-${bid}.json`;
      const gk=new Set(g.map(x=>x.key)),rows=M.out.filter(x=>gk.has(x.key)).map(x=>x.i);
      const nCat={v:1,p:CAT.p,ev:CAT.ev,g:CAT.g.slice()};rows.forEach(i=>{nCat.g[i]=null});
      const reg={};R.removed.forEach(r=>[r.b,r.w].forEach(n=>{const q=INDEX.players.find(p=>p[0]===n);if(q)reg[n]=q[3]||"ZZ"}));
      const lab=x=>`${x.rec.d} 黑 ${x.rec.b} vs 白 ${x.rec.w} ${x.rec.r||""}`;
      const fres=g.map(x=>[CAT.g[x.i]&&CAT.g[x.i][7]||lab(x),"del",x.i,lab(x)]);
      const nUpl={last:T.at,b:UPL.b.concat([{id:bid,at:T.at,by:ROLE.by,kind:"delete",grp,part:groups.length>1?[gi+1,groups.length]:null,add:0,del:R.removed.length,dup:0,bad:0,trash:tf,files:fres}])};
      const trash={v:1,kind:"kishi-lab-deleted",at:T.at,by:ROLE.by,batch:bid,reg,cat:rows.map(i=>[i,CAT.g[i]]),g:R.removed};
      const nIndex=R.index;nIndex.fv=Object.assign({},INDEX.fv||{});

  }catch(e){

/* 復原：把刪除時保留的棋譜放回資料庫（和上傳同樣的流程）。已經在資料庫裡的略過，所以中斷後再按一次也可以 */

  names.forEach(n=>{ev.set(n,[]);opp.set(n,[])});
  for(const x of UP.items){if(!x.rec||x.st==="bad"||x.st==="dupf")continue;
    for(const[me,o]of[[x.rec.b,x.rec.w],[x.rec.w,x.rec.b]])if(ev.has(me)){ev.get(me).push(x.rec.e||"");opp.get(me).push(o)}}
  const known=n=>{const p=INDEX&&INDEX.players.find(q=>q[0]===n);return p?p[3]||"ZZ":out[n]&&out[n].r!=="ZZ"?out[n].r:null};
  const pr=new Set();UP.items.forEach(x=>{if(x.pair&&x.rec){pr.add(x.rec.b);pr.add(x.rec.w)}});
  for(const n of names){
    const f=foldName(n);
    if(pr.has(n)){out[n]={r:"PR",src:"pair"};continue}
    if(X.ros.has(f)){out[n]={r:"TW",src:"roster"};continue}
    if(X.man.has(f)){out[n]={r:X.man.get(f),src:"manual"};continue}
    if(X.gor.has(f)){out[n]={r:X.gor.get(f),src:"gor"};continue}
    const c={};let tw=0;
    for(const e of ev.get(n)){const h=X.R.find(r=>r[2].test(e));if(h)c[h[0]]=(c[h[0]]||0)+h[1];else if(X.TWX.test(e))tw++}
    const top=Object.entries(c).sort((a,b)=>b[1]-a[1])[0];
    if(top){out[n]={r:top[0],src:"event"};continue}
    if(tw){out[n]={r:"TW",src:"tw"};continue}

    const top=Object.entries(c).sort((a,b)=>b[1]-a[1])[0];

/* 全部 shard 讀進來（重算排名要用全部對局；少一個就停，不會寫入） */
async function loadAllShards(prog){
  const N=INDEX.shards,out=new Array(N);let done=0;
  const one=async i=>{const g=UP.fresh&&UP.fresh[i]||(SHARDS.has(i)?SHARDS.get(i):await fetchShard(i,90000));out[i]=g;done++;prog(done,N)};

/* 一次發布改動的 shard 不超過 UP_GROUP 個：照順序把對局分組（新棋士的 shard 未定，算一個） */
function upGroups(items){
  const LIM=upLimit();
  const shOf=new Map(INDEX.players.map(p=>[p[0],"s"+p[2]])),sh=n=>shOf.get(n)||"n:"+n;
  /* 同一組 shard 的對局排在一起，每次發布能放進更多局 */
  const keyed=items.map(x=>({x,k:[sh(x.rec.b),sh(x.rec.w)].sort()}));
  keyed.sort((a,b)=>a.k[0]<b.k[0]?-1:a.k[0]>b.k[0]?1:a.k[1]<b.k[1]?-1:a.k[1]>b.k[1]?1:0);
  const gs=[];let cur=[],set=new Set();
  for(const{x,k}of keyed){
    const nx=new Set(set);k.forEach(v=>nx.add(v));
    if(cur.length&&nx.size>LIM){gs.push(cur);cur=[];set=new Set(k)}else set=nx;
    cur.push(x);
  }
  if(cur.length)gs.push(cur);
  return gs;
}

/* ============================================================

     帳號：Firestore 裡這個帳號專用的區域（users/<uid>/priv，規則只讓本人讀寫；所有裝置同步）。第一次存檔時確認權限。

   帳號儲存：整個頁面最多 25,000 份文件，所以一份文件裝多局（{v:2,g:{<id>:一局|null}}，最多約 230 KB）。
   每次只用 update 合併自己那幾局（null＝刪除），兩個分頁或兩台裝置同時存也不會互相蓋掉。
   ============================================================ */

let IDBH=null;
function idbOpen(){

  if(IDBH)return Promise.resolve(IDBH);

    r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains("games"))r.result.createObjectStore("games",{keyPath:"id"})};
    r.onsuccess=()=>{IDBH=r.result;IDBH._nm=nm;res(IDBH)};r.onerror=()=>rej(r.error||new Error("無法開啟瀏覽器儲存區"))});

const idbTx=(mode,fn)=>idbOpen().then(d=>new Promise((res,rej)=>{const tx=d.transaction("games",mode),st=tx.objectStore("games");const q=fn(st);tx.oncomplete=()=>res(q&&q.result!==undefined?q.result:undefined);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error||new Error("瀏覽器儲存失敗"))}));

  return new Promise(res=>{try{const q=indexedDB.deleteDatabase(nm);q.onsuccess=q.onerror=q.onblocked=()=>res()}catch(e){res()}})}
/* ---- 帳號（db） ---- */
const privCol=()=>PRIV.db.collection("data/users/"+PRIV.uid);
const dbCode=e=>e&&e.code;
async function dbRetry(fn){try{return await fn()}catch(e){if(dbCode(e)==="unavailable"){await new Promise(r=>setTimeout(r,600+Math.random()*900));return await fn()}throw e}}
async function accLoad(){
  const snap=await dbRetry(()=>privCol().get());
  const items=new Map();PRIV.where=new Map();PRIV.bytes=new Map();
  for(const d of snap.docs){
    if(!d.exists)continue;const b=d.data()||{};
    const g=b.g&&typeof b.g==="object"?b.g:null;if(!g)continue;

}
/* 第一次存檔時確認能不能寫進帳號（寫一份很小的文件） */
async function accProbe(){
  if(PRIV.perm==="ok")return true;
  try{await dbRetry(()=>PRIV.db.doc("data/users/"+PRIV.uid+"/meta").set({v:2}));PRIV.perm="ok";return true}
  catch(e){const c=dbCode(e);if(c==="invalid_argument"||c==="not_granted"){PRIV.perm="no";return false}throw e}
}
async function accAdd(items){
  /* 依大小分包，每包放進一份還有空間的文件（先重新讀一次大小），沒有就開新文件 */
  let pack=[],pb=0;const packs=[];
  for(const x of items){const l=rbUtf8Len(JSON.stringify(x))+12;if(pack.length&&pb+l>PRIV_CH/2){packs.push(pack);pack=[];pb=0}pack.push(x);pb+=l}
  if(pack.length)packs.push(pack);
  for(const p of packs){
    const add={};p.forEach(x=>add[x.id]=x);const need=rbUtf8Len(JSON.stringify(add));
    let target=[...PRIV.bytes.entries()].filter(([,b])=>b+need<PRIV_CH).sort((a,b)=>a[1]-b[1])[0];
    let done=false;
    if(target){
      const ref=privCol().doc(target[0]);
      try{
        const cur=await dbRetry(()=>ref.get());const now=cur.exists?rbUtf8Len(JSON.stringify(cur.data())):0;
        if(cur.exists&&now+need<PRIV_CH){await dbRetry(()=>ref.update({g:add}));PRIV.bytes.set(ref.id,now+need);done=true}
      }catch(e){if(dbCode(e)!=="invalid_argument")throw e}   /* 別的分頁剛好把它塞滿：改開新文件 */
      if(done)p.forEach(x=>PRIV.where.set(x.id,ref.id));
    }
    if(!done){const ref=privCol().doc();await dbRetry(()=>ref.set({v:2,g:add}));PRIV.bytes.set(ref.id,need+20);p.forEach(x=>PRIV.where.set(x.id,ref.id))}
  }
}
async function accDel(ids){
  const by=new Map();for(const id of ids){const c=PRIV.where.get(id);if(!c)continue;if(!by.has(c))by.set(c,{});by.get(c)[id]=null}
  for(const[c,g]of by)await dbRetry(()=>privCol().doc(c).update({g}));
  ids.forEach(id=>PRIV.where.delete(id));
}

/* 名字：先對齊棋譜庫裡已有的寫法（異體字），再對齊共用資料庫（對手是職業棋士時） */
function privCanon(n,lib,batch){
  n=(n||"").trim();const f=foldName(n);
  if(lib.has(f))return lib.get(f);
  const c=canonName(n,batch).n;lib.set(f,c);return c;
}
async function privTake(files){
  if(PRIV.busy)return;
  await privInit();
  if(PRIV.mode==="off"||PRIV.mode==="error")return;
  PRIV.busy=true;PRIV.msg="";PRIV.err="";PRIV.fail="";renderDT();
  let add=[];
  try{
    const have=new Set(PRIV.items.map(x=>x.id)),lib=new Map(),batch=new Map(),bad=[];let dup=0;
    PRIV.items.forEach(x=>{[x.rec.b,x.rec.w].forEach(n=>{const f=foldName(n);if(!lib.has(f))lib.set(f,n)})});
    const at=new Date().toISOString().slice(0,16);
    for(const f of files){
      try{
        if(f.size>MAXF)throw new Error("檔案太大");
        const rs=sgfToRecs(decodeSGF(await f.arrayBuffer()),{fileName:f.name}),many=rs.length>1;
        rs.forEach((o,i)=>{const fn=many?`${f.name}（第 ${i+1} 局）`:f.name;
          if(o.error){bad.push(fn+"："+o.error);return}
          o.rec.b=privCanon(o.rec.b,lib,batch);o.rec.w=privCanon(o.rec.w,lib,batch);
          const x=privClean({rec:o.rec,file:fn,at});
          if(!x||rbUtf8Len(JSON.stringify(x))>PRIV_ITEM){bad.push(fn+"：資料格式不正確或太大");return}
          if(have.has(x.id)){dup++;return}
          have.add(x.id);add.push(x)});
      }catch(e){bad.push(f.name+"："+((e&&e.message)||e))}
    }
    if(add.length){await privSave(add);PRIV.items=PRIV.items.concat(add);PRIV.stats=null;privRefreshAnalysis()}
    PRIV.msg=`加入 ${add.length} 局${dup?`，已有的 ${dup} 局略過`:""}${bad.length?`，無法使用 ${bad.length} 個`:""}。${add.length?(PRIV.mode==="account"?"（存在你的帳號）":"（存在這台電腦的瀏覽器）"):""}`;
    if(bad.length)PRIV.err=bad.slice(0,8).join("\n")+(bad.length>8?`\n…另 ${bad.length-8} 個`:"");
  }catch(e){PRIV.msg="";PRIV.err=(e&&e.message)||String(e);await privResync()}
  PRIV.busy=false;renderDT();
}
async function privDelete(ids,label){

/* 棋士一覽：3 局以上的棋士；10 局以上才顯示在職業棋士中的位置 */
function privStats(){
  if(PRIV.stats)return PRIV.stats;
  const by=new Map();PRIV.items.forEach(x=>{[x.rec.b,x.rec.w].forEach(n=>{if(!by.has(n))by.set(n,[]);by.get(n).push(x)})});
  const pro=n=>INDEX&&INDEX.players.some(p=>p[0]===n);
  const rows=[],few=[];
  for(const[n,xs]of by){
    if(xs.length<3){few.push(n);continue}
    try{
      const L=xs.map(x=>toGame(privDec(x),0,n)),st=cpStats(L);
      const r=xs.length>=10&&st.v.sa!=null?rankOf("sa",st.v.sa,20,[],n):null;
      rows.push({n,g:xs.length,win:st.v.win,sa:st.v.sa,s3a:st.v.s3a,loss:st.v[bandKey(BAND(),"a")],r,pro:pro(n),last:xs.map(x=>x.rec.d).sort().pop()});
    }catch(e){rows.push({n,g:xs.length,err:true,pro:pro(n)})}
  }
  rows.sort((a,b)=>b.g-a.g||(b.sa||0)-(a.sa||0));
  return PRIV.stats={rows,few};
}

const dzHTML=o=>`<div class="dz${o.big?" big":""}${o.dis?" dis":""}" id="${o.id}"><span class="dz-ic">${UPICO(o.big?34:30)}</span><p class="dz-t">${o.dis?esc(o.dis):`<span class="dz-dt">${esc(o.t||"把 .sgf 檔拖到這裡，或按「選擇檔案」")}</span><span class="dz-tc">按「選擇檔案」選 .sgf 檔</span>`}</p>${o.dis?"":`<div class="acts"><label class="btn dz-b" for="${o.inp}" tabindex="0" role="button">選擇檔案</label>${o.extra||""}</div><input type="file" id="${o.inp}" accept="${o.acc||".sgf,.SGF"}" multiple hidden>`}${o.sub?`<p class="sub dz-s">${o.sub}</p>`:""}</div>`;
/* 拖放區的動作：外框（card）整個都可以放檔案；選檔、放檔都交給 fn */
function bindDZ(card,dz,fn){
  if(!card||!dz)return;
  const isF=e=>e.dataTransfer&&[...(e.dataTransfer.types||[])].includes("Files");
  if(dz.classList.contains("dis")){   /* 處理中：放進來的檔案不要掉到整頁的處理，告訴使用者等一下 */
    ["dragenter","dragover"].forEach(t=>card.addEventListener(t,e=>{if(isF(e)){e.preventDefault();e.stopPropagation();dropHint(true,"還在處理中，請等一下再放入檔案",250)}}));
    card.addEventListener("drop",e=>{if(isF(e)){e.preventDefault();e.stopPropagation();dropHint(true,"還在處理中，這次放入的檔案沒有加入。請等一下再放一次。",4000)}});
    return}
  const fi=dz.querySelector("input[type=file]"),lb=dz.querySelector("label.dz-b");
  if(fi){fi.onchange=e=>{const f=[...e.target.files];e.target.value="";if(f.length)fn(f)};
    if(lb)lb.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();fi.click()}};
    dz.onclick=e=>{if(!e.target.closest("label,button,a,input,summary"))fi.click()}}
  ["dragenter","dragover"].forEach(t=>card.addEventListener(t,e=>{if(isF(e)){e.preventDefault();e.stopPropagation();dz.classList.add("over")}}));
  card.addEventListener("dragleave",e=>{if(!card.contains(e.relatedTarget))dz.classList.remove("over")});
  card.addEventListener("drop",e=>{if(!isF(e))return;e.preventDefault();e.stopPropagation();dz.classList.remove("over");const f=[...e.dataTransfer.files];if(f.length)fn(f)});
}

function takeFiles(files){
  const sgf=files.filter(f=>/\.(sgf|rsgf|txt)$/i.test(f.name));
  if(!sgf.length){REPORT.bad=["沒有 .sgf 檔"];S.dtTab="load";if(S.page==="dt")renderDT();else go("dt");return}
  busy(`解析 ${sgf.length} 個檔案…`);
  let done=0;const newRaw=[],bad=[];
  sgf.forEach(f=>{
    const fr=new FileReader();
    fr.onload=()=>{
      try{
        let got=0;
        sgfTrees(decodeSGF(fr.result)).forEach(t=>{const g=treeToRaw(t,f.name);if(g){newRaw.push(g);got++}});
        if(!got)bad.push(f.name);
      }catch(e){bad.push(f.name)}
      if(++done===sgf.length)finish();
    };
    fr.onerror=()=>{bad.push(f.name);if(++done===sgf.length)finish()};
    fr.readAsArrayBuffer(f);
  });
  function finish(){
    if(!newRaw.length){REPORT.bad=bad.length?bad:["沒有可以讀取的棋譜"];S.dtTab="load";if(S.page==="dt")renderDT();else go("dt");return}
    if(MODE!=="sgf"||S.privOn){RAW=[];REPORT={files:0,src:{},bad:[]};S.subject=""}
    MODE="sgf";S.privOn=false;
    const seen=new Set(RAW.map(sig));
    newRaw.forEach(g=>{const s=sig(g);if(!seen.has(s)){seen.add(s);RAW.push(g)}});
    REPORT.files+=sgf.length;REPORT.bad=bad;REPORT.src={};
    RAW.forEach(g=>Object.entries(g.src||{}).forEach(([k,v])=>REPORT.src[k]=(REPORT.src[k]||0)+v));
    S.game=null;resetLists();rebuild();saveLS();syncHeader();go(RAW.length?"ov":"dt");
  }
}

const CMP=new Map();
/* 棋譜を貯め込みすぎるとメモリが膨らんで固まるので、古いものから捨てる */
function trimCache(){
  while(SHARDS.size>6)SHARDS.delete(SHARDS.keys().next().value);
  while(CMP.size>4)CMP.delete(CMP.keys().next().value);
}
/* 比較は期間フィルタを掛けず、両者とも全期間・全対局で計算する（順位表と同じ土俵） */
async function cpLoad(name){
  if(!name||!INDEX)return null;
  const key=foldName(name);
  if(CMP.has(key))return CMP.get(key);
  const p=INDEX.players.find(x=>x[0]===name)
    ||INDEX.players.filter(x=>foldName(x[0])===key).sort((a,b)=>b[1]-a[1])[0];
  if(!p)return null;
  try{
    if(!SHARDS.has(p[2]))SHARDS.set(p[2],await fetchShard(p[2]));
  }catch(e){SHARDS.delete(p[2]);return null}
  trimCache();
  const L=SHARDS.get(p[2]).filter(g=>g.b===p[0]||g.w===p[0]).map(decodeGame).map((g,i)=>toGame(g,i,p[0]));
  L.sort((a,b)=>{if(a.date&&b.date)return b.date-a.date;if(a.date)return -1;if(b.date)return 1;return 0});
  const o={name:p[0],games:L,st:cpStats(L)};
  CMP.set(key,o);trimCache();return o;
}
function cpStats(L){
  const W=winRate(L),ps=phaseStats(L);
  const agg=k=>{let a=0,c=0;L.forEach(g=>{for(let p=0;p<3;p++){a+=g[k][p];c+=g.sCnt[p]}});return c?a/c*100:null};
  const v={win:W.n?W.w/W.n*100:null,sa:agg("sSum"),s3a:agg("s3Sum"),
    sf:ps[0].sr1,sm:ps[1].sr1,se:ps[2].sr1,s3f:ps[0].sr3,s3m:ps[1].sr3,s3e:ps[2].sr3,g:L.length};
  CFG.mt.forEach((t,i)=>{
    v["N"+t+"a"]=mistPerGame(L,i);
    v["K"+t+"a"]=bandMistRate(L,i);
    ["f","m","e"].forEach((suf,p)=>{v["N"+t+suf]=mistPerGame(L,i,p);v["K"+t+suf]=bandMistRate(L,i,p)});
  });
  v[bandKey(BAND(),"a")]=pool(L,"l");
  Object.assign(v,qfVals(L));
  const bk=["f","m","e"];
  bk.forEach((suf,p)=>{let a=0,c=0;L.forEach(g=>{a+=g.lSum[p];c+=g.lCnt[p]});v[bandKey(BAND(),suf)]=c?a/c:null});
  const dts=L.map(g=>g.dt).filter(Boolean).sort();
  return{v,W,ps,n:L.length,from:dts[0]||"",to:dts[dts.length-1]||""};
}
/* 全棋士の中での位置（0＝最上位）。順位が取れない棋士は数値の比で代用する */
function cpPair(id,A,B){
  const m=MI(id);
  const a=A.st.v[id],b=B.st.v[id];
  /* 名次的母體跟著「比較對象」（地區）走；兩人放進同一個母體比 */
  const ra=rankOf(id,a,S.rkMin,undefined,A.name),rb=rankOf(id,b,S.rkMin,undefined,B.name);
  let wa=0,wb=0;
  if(ra&&rb){wa=Math.max(0,(1-ra.pct)*100);wb=Math.max(0,(1-rb.pct)*100)}
  else{
    const x=a==null?0:Math.max(0,a),y=b==null?0:Math.max(0,b),t=x+y;
    if(t>0){wa=(m.dir>0?x:y)/t*100;wb=(m.dir>0?y:x)/t*100}
  }
  const gap=(ra&&rb)?rb.pct-ra.pct:null;
  /* 全棋士中の位置が 3 ポイント以内なら差とみなさない */
  const win=(a==null||b==null)||(gap!=null&&Math.abs(gap)<0.03)?-1
    :(m.dir>0?(a>b?0:a<b?1:-1):(a<b?0:a>b?1:-1));
  return{m,a,b,ra,rb,wa,wb,win,gap};
}

/* Firebase 的錯誤代碼 → 頁面原本用的代碼（not_granted、invalid_argument、unavailable、rate_limited） */
const fsCode=e=>{const c=String(e&&e.code||"").replace(/^firestore\//,"");
  return c==="permission-denied"?"not_granted":c==="invalid-argument"?"invalid_argument":c==="resource-exhausted"?"rate_limited":c==="unauthenticated"?"unauthenticated":c==="not_found"?"not_found":c||"error"};
const fsW=p=>p.catch(e=>{const x=new Error((e&&e.message)||String(e));x.code=fsCode(e);throw x});
async function fsGz(str){return new Uint8Array(await new Response(new Blob([str]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer())}
async function fsUngz(u8){return await new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream("gzip"))).text()}
/* 讀一個資料檔（回傳 JSON）。逾時的話丟 AbortError（和原本 fetch 的處理相同） */
async function fsRead(name,ms){return JSON.parse(await fsReadText(name,ms))}
/* 讀一個資料檔的原文（JSON 字串，不解析：備份用） */
async function fsReadText(name,ms){
  const run=async()=>{
    const col=FS.db.collection("files"),d=await fsW(col.doc(name).get());
    if(!d.exists){if(name==="index.json")FS.empty=true;const e=new Error("資料庫裡沒有 "+name);e.code="not_found";throw e}
    const h=d.data(),n=h.n||1,rest=[];
    for(let i=1;i<n;i++)rest.push(fsW(col.doc(name+"~"+i).get()));
    const parts=[h.z.toUint8Array()];
    for(const c of await Promise.all(rest)){if(!c.exists)throw new Error(name+" 的資料不完整（缺一段）");parts.push(c.data().z.toUint8Array())}
    let len=0;parts.forEach(p=>len+=p.length);const all=new Uint8Array(len);let o=0;parts.forEach(p=>{all.set(p,o);o+=p.length});
    return await fsUngz(all);
  };
  let tm;
  return Promise.race([run(),new Promise((_,rej)=>{tm=setTimeout(()=>{const e=new Error("逾時");e.name="AbortError";rej(e)},ms||45000)})]).finally(()=>clearTimeout(tm));
}
/* 寫一個資料檔（str＝JSON 字串）：先寫後面的段落，最後寫主文件（主文件的 n 一換，讀的人就拿到新內容） */
async function fsWrite(name,str){
  const gz=await fsGz(str),n=Math.max(1,Math.ceil(gz.length/FS_CHUNK)),col=FS.db.collection("files"),B=firebase.firestore.Blob;
  for(let i=1;i<n;i++)await fsW(col.doc(name+"~"+i).set({z:B.fromUint8Array(gz.subarray(i*FS_CHUNK,(i+1)*FS_CHUNK))}));
  await fsW(col.doc(name).set({n,z:B.fromUint8Array(gz.subarray(0,FS_CHUNK)),size:str.length,at:firebase.firestore.FieldValue.serverTimestamp()}));
}
/* 管理頁的「發布」：{"data/<檔名>": JSON 字串}。index.json 最後寫（它記著各檔的版本） */
async function fsPublish(files){
  const ks=Object.keys(files).sort((a,b)=>(a==="data/index.json")-(b==="data/index.json"));
  for(const k of ks)await fsWrite(k.replace(/^data\//,""),files[k]);
}
/* 我的棋譜庫：頁面原本的路徑 data/users/<uid>[/<文件>] → Firestore 的 users/<uid>/priv[/<文件>]。
   update＝合併（set merge），和原本「只改自己那幾局」的用法相同 */
function fsPrivDb(){
  if(!FS.user||!ROLE.admin)return null;   /* 共用帳號不開我的棋譜庫 */
  const map=p=>{const m=/^data\/users\/([^/]+)(\/.*)?$/.exec(p);if(!m||m[1]!==FS.user.uid){const e=new Error("路徑不對");e.code="not_granted";throw e}return "users/"+m[1]+"/priv"+(m[2]||"")};
  const ref=r=>({id:r.id,get:()=>fsW(r.get()),set:v=>fsW(r.set(v)),update:v=>fsW(r.set(v,{merge:true}))});
  return{collection:p=>{const c=FS.db.collection(map(p));return{get:()=>fsW(c.get()),doc:id=>ref(id?c.doc(id):c.doc())}},doc:p=>ref(FS.db.doc(map(p)))};
}

  if(!ROLE.admin)return "";
  return `<section class="panel" id="fsImp"><div class="panel-h"><h2>${first?"匯入資料":"從備份還原整個資料庫"}</h2><p>${first?"第一次使用：把備份的資料檔寫進資料庫":"資料庫壞掉、或要退回某個備份時才用"}</p></div>
    <p class="sub">選電腦裡備份的 <b>data</b> 資料夾（裡面有 index.json、rank.json、s0.json…）。${first?"":"<b>會覆蓋現在資料庫裡的內容</b>，平常不需要用。"}寫入約 156 個檔案、需要幾分鐘，途中請不要關閉畫面。</p>
    <p style="margin-top:10px">${FSIMP.busy?`<span class="sub">匯入中…</span>`:`<label class="btn-link" for="fsImpIn" tabindex="0" role="button">選擇 data 資料夾…</label><input type="file" id="fsImpIn" webkitdirectory multiple hidden>`}</p>
    <p class="sub" id="fsImpMsg" style="margin-top:8px">${esc(FSIMP.msg)}</p></section>`;
}
/* ---------- 下載資料庫備份（管理頁）：Firestore 裡的全部資料檔 → 一個 zip（裡面是 data\*.json，解壓後就是「匯入」要選的那個資料夾） ---------- */
const FSBK={busy:false,msg:""};
function fsBackupPanel(){
  if(!ROLE.admin)return "";
  return `<section class="panel" id="fsBk"><div class="panel-h"><h2>下載資料庫備份</h2><p>把現在的整個資料庫存回電腦</p></div>
    <p class="sub">下載一個 zip 檔（約 100 MB），解壓縮後是一個 <b>data</b> 資料夾。要還原時，在下面的「從備份還原整個資料庫」選這個資料夾就好。建議每次上傳一批棋譜後下載一次。</p>
    <p style="margin-top:10px"><button class="btn-link" id="fsBkGo"${FSBK.busy||UP.busy||DEL.busy?" disabled":""}>下載備份（zip）</button></p>
    <p class="sub" id="fsBkMsg" style="margin-top:8px">${esc(FSBK.msg)}</p></section>`;
}
/* 不壓縮的 zip（檔名用 UTF-8）。JSON 檔案總共不到 4 GB，不需要 zip64 */
const CRCT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=u=>{let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRCT[(c^u[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0};
function zipStore(files){
  const enc=new TextEncoder(),parts=[],cen=[];let off=0;
  const d=new Date(),tm=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),dt=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
  for(const f of files){
    const nm=enc.encode(f.name),data=f.data,crc=crc32(data);
    const h=new DataView(new ArrayBuffer(30));
    [[0,0x04034b50,4],[4,20,2],[6,0x0800,2],[8,0,2],[10,tm,2],[12,dt,2],[14,crc,4],[18,data.length,4],[22,data.length,4],[26,nm.length,2],[28,0,2]].forEach(([o,v,n])=>n===4?h.setUint32(o,v,true):h.setUint16(o,v,true));
    parts.push(h.buffer,nm,data);
    const c=new DataView(new ArrayBuffer(46));
    [[0,0x02014b50,4],[4,20,2],[6,20,2],[8,0x0800,2],[10,0,2],[12,tm,2],[14,dt,2],[16,crc,4],[20,data.length,4],[24,data.length,4],[28,nm.length,2],[30,0,2],[32,0,2],[34,0,2],[36,0,2],[38,0,4],[42,off,4]].forEach(([o,v,n])=>n===4?c.setUint32(o,v,true):c.setUint16(o,v,true));
    cen.push(c.buffer,nm);off+=30+nm.length+data.length;
  }
  let cl=0;cen.forEach(x=>cl+=x.byteLength);
  const e=new DataView(new ArrayBuffer(22));
  [[0,0x06054b50,4],[4,0,2],[6,0,2],[8,files.length,2],[10,files.length,2],[12,cl,4],[16,off,4],[20,0,2]].forEach(([o,v,n])=>n===4?e.setUint32(o,v,true):e.setUint16(o,v,true));
  return new Blob(parts.concat(cen,[e.buffer]),{type:"application/zip"});
}
async function fsBackup(){
  if(FSBK.busy||UP.busy||DEL.busy||!ROLE.admin)return;
  const say=t=>{FSBK.msg=t;const e=document.getElementById("fsBkMsg");if(e)e.textContent=t};
  const bt=document.getElementById("fsBkGo");if(bt)bt.disabled=true;
  FSBK.busy=true;
  try{
    say("讀取資料庫…");
    const idxT=await fsReadText("index.json",90000),idx=JSON.parse(idxT);
    const upl=await fsRead("uploads.json",90000);
    const names=["rank.json","open.json","catalog.json","uploads.json"].concat(Array.from({length:idx.shards},(_,k)=>"s"+k+".json"),
      [...new Set((upl.b||[]).map(b=>b&&b.trash).filter(t=>typeof t==="string"&&/^del-\d+\.json$/.test(t)))]);
    const enc=new TextEncoder(),files=[];let k=0;
    const q=names.slice();
    await Promise.all(Array.from({length:6},async()=>{while(q.length){const n=q.shift();let t;
      try{t=await fsReadText(n,90000)}catch(e){if(/^del-/.test(n)&&e&&e.code==="not_found"){k++;continue}throw e}
      files.push({name:"data/"+n,data:enc.encode(t)});say(`讀取資料庫… ${++k}/${names.length}`)}}));
    files.push({name:"data/index.json",data:enc.encode(idxT)});
    files.sort((a,b)=>a.name.localeCompare(b.name,"en",{numeric:true}));
    say("打包中…");
    const blob=zipStore(files),nm=`棋士研究室備份-${fmtD(new Date())}.zip`;
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=nm;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},60000);
    say(`已下載「${nm}」（${files.length} 個檔案、${(blob.size/1048576).toFixed(0)} MB、${Number(idx.n).toLocaleString()} 局）。`);
  }catch(e){say("下載備份失敗："+((e&&e.message)||e)+"。請重新整理後再試一次。")}
  FSBK.busy=false;if(bt)bt.disabled=false;
}
function fsBindImport(el){
  const bk=el.querySelector("#fsBkGo");if(bk)bk.onclick=()=>fsBackup();
  const i=el.querySelector("#fsImpIn");if(!i)return;
  i.onchange=e=>{const f=[...e.target.files];e.target.value="";if(f.length)fsImport(f)};
  const lb=el.querySelector('label[for="fsImpIn"]');if(lb)lb.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();i.click()}};
}
async function fsImport(list){
  if(FSIMP.busy||UP.busy||DEL.busy||!ROLE.admin)return;
  const say=t=>{FSIMP.msg=t;const e=document.getElementById("fsImpMsg");if(e)e.textContent=t};
  const by=new Map();list.forEach(f=>{if(/^(index|rank|open|catalog|uploads|s\d+|del-\d+)\.json$/.test(f.name))by.set(f.name,f)});
  if(!by.has("index.json")){say("選的資料夾裡沒有 index.json。請選備份的 data 資料夾。");return}
  let idx;try{idx=JSON.parse(await by.get("index.json").text())}catch(e){say("index.json 讀不懂，檔案可能壞了。");return}
  if(!idx||!Array.isArray(idx.players)||!(idx.shards>0)){say("index.json 的內容不對。");return}
  const need=["rank.json","open.json","catalog.json","uploads.json"].concat(Array.from({length:idx.shards},(_,k)=>"s"+k+".json"));
  const miss=need.filter(n=>!by.has(n));
  if(miss.length){say(`資料夾裡缺少 ${miss.length} 個檔案（${miss.slice(0,6).join("、")}${miss.length>6?"…":""}），沒有匯入。`);return}
  if(!await uiConfirm(`要把這個資料夾的 ${by.size} 個檔案（${Number(idx.n).toLocaleString()} 局、${idx.players.length.toLocaleString()} 位棋士）寫進資料庫嗎？${FS.empty?"":"\n\n現在資料庫裡的內容會被覆蓋，所有人都會看到換過的資料。"}`,{ok:"匯入",danger:!FS.empty}))return;
  FSIMP.busy=true;UP.busy=true;
  const guard=e=>{e.preventDefault();e.returnValue="";return ""};window.addEventListener("beforeunload",guard);
  try{
    const names=[...by.keys()].filter(n=>n!=="index.json").sort((a,b)=>a.localeCompare(b,"en",{numeric:true}));
    let k=0;
    for(const n of names){say(`寫入中… ${++k}/${by.size}（${n}）`);const t=await by.get(n).text();JSON.parse(t);await fsWrite(n,t)}
    say(`寫入中… ${by.size}/${by.size}（index.json）`);
    await fsWrite("index.json",await by.get("index.json").text());
    window.removeEventListener("beforeunload",guard);
    say("匯入完成，重新載入畫面…");setTimeout(()=>location.reload(),800);
  }catch(e){
    window.removeEventListener("beforeunload",guard);
    say("匯入失敗："+((e&&e.message)||e)+(e&&e.code==="not_granted"?"（這個帳號沒有寫入權限，請確認 Firestore 規則的管理者名單）":"")+"。可以再選一次資料夾重來，已經寫進去的會被覆蓋，不會重複。");
  }
  FSIMP.busy=false;UP.busy=false;
}
/* ---------- 登入 ---------- */
function fsInit(){
  const L=document.getElementById("login"),msg=document.getElementById("loginMsg"),btn=document.getElementById("loginBtn"),err=document.getElementById("loginErr");
  if(!FB_CONFIG.apiKey){msg.textContent="網站還沒有設定 Firebase（程式裡的 FB_CONFIG 是空的）。";return}
  if(!("DecompressionStream" in window)||!("CompressionStream" in window)){msg.textContent="這個瀏覽器版本太舊，請改用最新版的 Chrome、Edge 或 Safari。";return}
  try{FS.app=firebase.initializeApp(FB_CONFIG,"qishi-lab");FS.auth=FS.app.auth();FS.db=FS.app.firestore()}
  catch(e){msg.textContent="無法連線到 Firebase（"+((e&&e.message)||e)+"）。";return}
  FS.store={publish:fsPublish};FS.privDb=fsPrivDb;
  let started=false;
  const form=document.getElementById("loginForm");
  /* 網址加 ?logout：登出這台電腦（共用帳號沒有登出按鈕時用） */
  const qs=new URLSearchParams(location.search);
  if(qs.has("logout")){qs.delete("logout");history.replaceState(null,"",location.pathname+(qs.toString()?"?"+qs:"")+location.hash);FS.auth.signOut().catch(()=>{})}
  FS.auth.onAuthStateChanged(u=>{
    FS.user=u;
    if(!u){if(started){location.reload();return}L.hidden=false;msg.textContent="請輸入帳號和密碼。";form.hidden=false;document.getElementById("loginUser").focus();return}
    L.hidden=true;
    const a=document.getElementById("acct");a.hidden=false;document.getElementById("acctName").textContent=(u.email||"").replace("@"+LOGIN_DOMAIN,"");
    document.getElementById("acctOut").hidden=SHARED_ACCOUNTS.includes((u.email||"").toLowerCase());
    if(!started){started=true;boot()}
  });
  form.onsubmit=async e=>{
    e.preventDefault();err.textContent="";
    const nm=document.getElementById("loginUser").value.trim(),pw=document.getElementById("loginPass").value;
    if(!nm||!pw)return;
    const email=nm.includes("@")?nm:nm+"@"+LOGIN_DOMAIN;
    btn.disabled=true;btn.textContent="登入中…";
    try{await FS.auth.signInWithEmailAndPassword(email,pw)}
    catch(x){const c=x&&x.code;
      err.textContent=c==="auth/invalid-credential"||c==="auth/wrong-password"||c==="auth/user-not-found"||c==="auth/invalid-login-credentials"||c==="auth/invalid-email"?"帳號或密碼不對。"
        :c==="auth/too-many-requests"?"試太多次了，請過幾分鐘再試。"
        :c==="auth/user-disabled"?"這個帳號已被停用。"
        :c==="auth/network-request-failed"?"網路連不上，請確認網路後再試。"
        :"登入失敗："+((x&&x.message)||c||x);
      btn.disabled=false;btn.textContent="登入";}
  };
  document.getElementById("acctOut").onclick=()=>FS.auth.signOut();
}
fsInit();
/* @@FS-END */
