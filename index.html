<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>棋士研究室</title><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
</head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 版面：固定頁首（研究對象＋期間篩選＋分頁）＋單欄內容，研究頁為「對局列表｜棋盤｜勝率圖」三欄，窄螢幕依序堆疊 */
:root{
  --bg:#F2F4F3;--surface:#FFFFFF;--surface2:#E9EEED;--ink:#1A2227;--muted:#5B6870;--faint:#8A969C;--line:#D6DEDD;
  --accent:#245E7F;--accent-bg:#E0EBF1;--accent-ink:#1B4A64;
  --good:#2F7A57;--good-bg:#E2F0E8;--warn:#9A5F15;--warn-bg:#F6EAD6;--bad:#B23A30;--bad-bg:#F7E2DF;
  --wood:#E4BD74;--wood-line:#5A3B12;--band0:rgba(47,122,87,.07);--band1:rgba(36,94,127,.07);--band2:rgba(178,58,48,.07);
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#101518;--surface:#172026;--surface2:#1E2930;--ink:#E3E9EB;--muted:#9AA8AF;--faint:#6F7E86;--line:#2A373E;
  --accent:#86B9D6;--accent-bg:#1C3342;--accent-ink:#B9D8EA;
  --good:#6CC39A;--good-bg:#17312A;--warn:#E3AC5E;--warn-bg:#382A15;--bad:#EE8577;--bad-bg:#3B1F1B;
  --wood:#CFA55C;--wood-line:#3A2608;--band0:rgba(108,195,154,.08);--band1:rgba(134,185,214,.08);--band2:rgba(238,133,119,.08);
}}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#101518;--surface:#172026;--surface2:#1E2930;--ink:#E3E9EB;--muted:#9AA8AF;--faint:#6F7E86;--line:#2A373E;
  --accent:#86B9D6;--accent-bg:#1C3342;--accent-ink:#B9D8EA;
  --good:#6CC39A;--good-bg:#17312A;--warn:#E3AC5E;--warn-bg:#382A15;--bad:#EE8577;--bad-bg:#3B1F1B;
  --wood:#CFA55C;--wood-line:#3A2608;--band0:rgba(108,195,154,.08);--band1:rgba(134,185,214,.08);--band2:rgba(238,133,119,.08);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6;padding:0 16px 48px}
.wrap{max-width:1120px;margin:0 auto}
h1,h2,h3{font-family:var(--serif);font-weight:700;text-wrap:balance;margin:0}
h1{font-size:22px;letter-spacing:.02em}
h2{font-size:18px}
h3{font-size:15px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
code{font-family:var(--mono);background:var(--surface2);padding:1px 5px;border-radius:4px;font-size:12px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,label:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;border-bottom:1px solid var(--line);margin-bottom:20px}
.toprow{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand small{color:var(--faint);font-size:12px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters select,.filters input{font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px;max-width:190px}
.search{display:inline-flex;gap:8px;align-items:center}
.go-btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:6px;padding:6px 14px;font-size:13px;font-weight:500}
.go-btn:hover{filter:brightness(1.1)}
.range{display:inline-flex;gap:6px;align-items:center}
.more{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 14px;font-size:13px;color:var(--accent);margin-top:10px;width:100%}
.more:hover{border-color:var(--accent)}
.segw{display:inline-flex;align-items:center;gap:6px}
.seglab{font-size:12px;color:var(--muted);white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.segw{flex-wrap:wrap}
.seg{flex-wrap:wrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent-bg);color:var(--accent-ink);font-weight:500}
.stone{display:inline-block;width:11px;height:11px;border-radius:50%;border:1px solid #2A2A28;flex:none}
.stone.b{background:#1E1E1C}.stone.w{background:#FAFAF7}
nav.pages{display:flex;gap:4px;margin-top:12px;overflow-x:auto}
nav.pages button{border:0;background:transparent;padding:8px 14px;border-radius:6px 6px 0 0;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
nav.pages button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:500}
.tag{font-size:12px;padding:2px 8px;border-radius:4px;background:var(--surface2);color:var(--muted)}
.tag.warn{color:var(--warn);background:var(--warn-bg)}
.flash{animation:flash .9s ease-out}
@keyframes flash{from{background:var(--accent-bg)}to{background:transparent}}

.grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.panel-h p{margin:0;color:var(--muted);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.kpi .l{font-size:12px;color:var(--muted);letter-spacing:.04em}
.kpi .v{font-size:26px;font-weight:500;line-height:1.3}
.kpi .s{font-size:12px;color:var(--faint)}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}

.phases{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.phases{grid-template-columns:1fr}}
.phase{border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;gap:8px;background:var(--surface);text-align:left}
.phase:hover{border-color:var(--accent)}
.phase .t{display:flex;justify-content:space-between;align-items:center}
.pill{font-size:12px;padding:2px 8px;border-radius:999px;font-weight:500}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.mid{background:var(--surface2);color:var(--muted)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.meter{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%}
.mrow{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(40px,1fr) 46px;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.mrow>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phase .go{font-size:12px;color:var(--accent)}

.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
@media (max-width:860px){.two{grid-template-columns:1fr}}
.insight{display:grid;grid-template-columns:4px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.insight:last-child{border-bottom:0}
.insight p{margin:0}
.insight .link{background:none;border:0;padding:0;color:var(--accent);font-size:13px;margin-top:4px}
.rep{display:grid;gap:16px}
.rsec h3{font-size:14px;margin-bottom:6px;display:flex;align-items:center;gap:7px}
.rsec h3 i{font-style:normal;font-family:var(--mono);font-size:12px;width:20px;height:20px;border-radius:50%;background:var(--accent-bg);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;flex:none}
.rsec ul{margin:0;padding-left:28px;display:grid;gap:5px;font-size:13px;list-style:disc}
.rsec li{line-height:1.65}
.rsec .link{background:none;border:0;padding:0;color:var(--accent);font-size:13px;cursor:pointer}
.up{color:var(--good);font-weight:500}.down{color:var(--bad);font-weight:500}

.list .row{display:grid;gap:10px;align-items:center;padding:9px 10px;border-bottom:1px solid var(--line);font-size:13px;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;min-width:0}
.list .row:hover{background:var(--surface2)}
.list .row.on{background:var(--accent-bg);color:var(--accent-ink)}
.res-w{color:var(--good)}.res-l{color:var(--bad)}
.sub{font-size:12px;color:var(--muted)}
.chip{display:inline-block;width:10px;height:10px;border-radius:2px;flex:none}
.ell{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.fu-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,430px);gap:20px}
@media (max-width:860px){.fu-layout{grid-template-columns:1fr}}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;font-size:13px}
.tabs button.on{background:var(--accent-bg);color:var(--accent-ink);border-color:var(--accent)}
.strip{display:flex;gap:3px;flex-wrap:wrap}
.strip span{width:16px;height:16px;border-radius:3px}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.note{font-size:13px;padding:9px 12px;border-radius:6px;background:var(--warn-bg);color:var(--warn);margin-top:10px}

.boardbox{display:grid;gap:8px;justify-items:stretch;min-width:0}
.wrbar{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr) minmax(0,auto);gap:8px;align-items:center;width:100%;max-width:430px;margin-inline:auto}
.wn{font-size:13px;font-weight:600;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.wtrack{position:relative;height:20px;border-radius:4px;background:#efeade;border:1px solid #b9b2a0;overflow:hidden}
.wtrack i{position:absolute;left:0;top:0;bottom:0;background:#23221e;transition:width .15s}
.wtrack em{position:absolute;top:50%;transform:translateY(-50%);font-style:normal;font-size:11px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.wtrack em.l{left:6px}.wtrack em.r{right:6px}
.wtrack u{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:11px;font-family:var(--mono);text-decoration:none;color:#9a9488}
.cpick{display:flex;gap:10px 14px;flex-wrap:wrap;align-items:flex-end}
.cpick label{display:grid;gap:4px;font-size:12px;color:var(--muted);position:relative}
.cpick input{min-width:170px;font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.rtag{display:inline-block;font-size:11px;line-height:1.6;padding:0 7px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);color:var(--muted);vertical-align:middle;white-space:nowrap}
.rtag.rTW{background:#E6EFE9;border-color:#BBD5C4;color:#2F6B4A}
.rtag.rJP{background:#EAEEF4;border-color:#C3CEDE;color:#39527A}
.rtag.rKR{background:#F3E9EC;border-color:#DDC4CB;color:#7E3C4F}
.rtag.rCN{background:#F5EDDF;border-color:#DECBAC;color:#7A5A20}
.rtag.rPR{background:#EFE9F5;border-color:#D2C5E2;color:#5B3F82}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  .rtag.rTW{background:#1B2E22;border-color:#2F5340;color:#8CC9A5}
  .rtag.rJP{background:#1A2330;border-color:#2E405A;color:#9DB6DA}
  .rtag.rKR{background:#2C1C22;border-color:#4D3038;color:#D79DAE}
  .rtag.rCN{background:#2B2518;border-color:#4C412A;color:#D3B47C}
  .rtag.rPR{background:#261D30;border-color:#43345A;color:#C2A8E4}
}}
.rgtbl td.num,.rgtbl th{white-space:nowrap}
.radar{width:100%;max-width:400px;margin-inline:auto;display:block}
.relwrap{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
.relwrap .rgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
.radarbox{min-width:0;display:grid;grid-template-columns:minmax(0,400px) minmax(0,300px);justify-content:center;align-items:center;gap:4px 24px}
.radarbox>*{grid-column:1/-1}
.radarbox>svg.radar{grid-column:1}
.radarbox>.rleg3{grid-column:2;margin:0}
.radarbox .rdctl,.cpmid .rdctl{justify-content:center;margin:0 0 6px}
.pos{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:7px 14px;margin:0 0 14px;padding:12px 14px;background:var(--surface2);border-radius:10px;font-size:13.5px;line-height:1.55}
.pos dt{color:var(--muted);font-size:12.5px;padding-top:1px}
.pos dd{margin:0;min-width:0}
.pchip{display:inline-block;font-size:11px;font-weight:600;padding:0 7px;border-radius:999px;margin:0 4px 0 2px;background:var(--surface);border:1px solid currentColor}
.pchip.t0,.pchip.t1{color:var(--good)}.pchip.t2{color:var(--accent-ink)}.pchip.t3{color:var(--warn)}.pchip.t4{color:var(--bad)}
.cp3{display:grid;grid-template-columns:minmax(256px,1fr) minmax(0,360px) minmax(256px,1fr);gap:14px;align-items:center}
.cpmid{min-width:0}
.cpside{display:grid;gap:12px;min-width:0}
.cps{display:grid;grid-template-columns:52px 148px minmax(40px,1fr);gap:8px;align-items:center}
.cpside.b .cps{grid-template-columns:minmax(40px,1fr) 148px 52px}
.cps .val em.f{color:var(--faint)}
.cpv em.ox{color:var(--faint)}
.mrow small.ox{display:block;font-size:10.5px;color:var(--faint);line-height:1.1}
.cps .val em.eg{color:var(--ink);font-size:12px}
.rt-r{font-size:11px;color:var(--muted);font-family:var(--mono)}
.rt-m{font-size:12px;color:var(--ink);line-height:1.4}
.rt-s{font-size:11px;color:var(--faint);font-family:var(--mono)}
.cps .val em.m{color:var(--ink);font-size:11px;line-height:1.3;font-family:inherit}
.refsel{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}
/* 篩選（桌面版照常排；手機收起來） */
.flt-tgl{display:none}
.fmore{display:contents}
.rt-m .sh,.rt-r .sh{display:none}
.cpm{display:none}
.sezoom{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 6px}
@media (max-width:760px){
  header.top{display:contents}
  .toprow{padding-top:10px}
  .brand h1{font-size:20px}
  .filters{width:100%}
  .search{width:100%}
  .search input{flex:1;min-width:0;max-width:none}
  .flt-tgl{display:flex;align-items:center;gap:6px;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;font-size:13px;text-align:left}
  .flt-tgl .ft{font-weight:600;color:var(--ink)}
  .flt-tgl .fs{flex:1;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .flt-tgl .fa{color:var(--muted)}
  .fmore{display:none;width:100%}
  .fmore.open{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:10px 2px 4px}
  .fmore select{max-width:none;min-height:38px}
  /* 分頁列一直留在畫面上 */
  nav.pages{position:sticky;top:0;z-index:20;background:var(--bg);margin:10px -16px 14px;padding:0 10px;border-bottom:1px solid var(--line);scrollbar-width:none}
  nav.pages::-webkit-scrollbar{display:none}
  nav.pages button{padding:11px 12px}
  /* 點得到的大小 */
  .seg button{padding:9px 12px}
  .rdctl label,.refsel label{min-height:34px;padding:2px 4px}
  .rdctl input[type=checkbox],.refsel input[type=checkbox]{width:18px;height:18px}
  .pbtn{padding:7px 10px}
  /* 總覽：圖在前，卡片兩欄、短的說明 */
  .relwrap{display:flex;flex-direction:column}
  .pos{grid-template-columns:minmax(0,1fr);gap:1px;padding:10px 12px}
  .pos dt{margin-top:7px}.pos dt:first-child{margin-top:0}
  .rgrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;gap:8px}
  .rt{padding:9px 10px;gap:4px}
  .rt-v b{font-size:19px}
  .rt-m .lg,.rt-r .lg{display:none}
  .rt-m .sh,.rt-r .sh{display:inline}
  .rt-m{font-size:11.5px}
}
.refsel label{display:inline-flex;align-items:center;gap:4px}
.sw{display:inline-block;width:14px;height:4px;border-radius:2px}
.cps .bar u{width:2px!important;margin-left:0!important}
.rleg3{display:grid;gap:5px;font-size:12px;color:var(--ink);margin:8px auto 0;max-width:360px}
.rleg3 span{display:flex;align-items:center;gap:8px;line-height:1.35}
.rleg3 span.sub{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.note-f{font-size:12.5px;background:var(--surface2);border-left:3px solid var(--warn);padding:7px 10px;border-radius:6px;margin:0 0 10px;line-height:1.5}
.upt .link,.cst .link,.upq .link,.note .link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font:inherit}
.cst .link{color:var(--accent-ink);text-decoration:underline dotted;text-underline-offset:3px}
.upt td,.cst td{vertical-align:top}
.cst td.ell{max-width:260px}
.upq{display:grid;gap:0;margin-top:12px;border-top:1px solid var(--line)}
.upi{padding:8px 2px;border-bottom:1px solid var(--line);display:grid;gap:2px;font-size:13px;min-width:0}
.upi-h{display:flex;align-items:center;gap:8px;min-width:0}
.upi-f{flex:1;min-width:0;color:var(--muted);font-size:12px}
.upi-x{flex:none;padding:6px 4px!important}
.upi-g{line-height:1.5}
.upi-e{font-size:12px;line-height:1.45;overflow-wrap:anywhere}
.stc{flex:none;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--surface2)}
.st-new{color:var(--good);background:var(--good-bg)}.st-warn{color:var(--warn);background:var(--warn-bg)}.st-mute{color:var(--muted)}.st-bad{color:var(--bad);background:var(--bad-bg)}
.dthead{padding-bottom:0}
.dth-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px 16px;flex-wrap:wrap}
.dth-top h2{margin:0}
.dth-stats{font-size:13px;color:var(--muted)}
.dth-stats b{color:var(--ink);font-family:var(--mono);font-weight:500}
.dttabs{display:flex;gap:2px;margin:12px -4px 0;overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--line)}
.dttabs::-webkit-scrollbar{display:none}
.dttabs button{flex:none;border:0;background:none;color:var(--muted);font:inherit;font-size:14px;padding:11px 12px 10px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}

<script>
/* ============================================================
   設定與狀態
   ============================================================ */
const KBAND=40;   /* 關鍵場面＝勝率 50±40%＝10–90% */
const CFG={pov:"auto",th1:3,th2:8,p1:50,p2:150,depth:4,omode:"self",oself:2,band:"b3",mt:[5,10,20,30,50]};
const MTH=[3,5,8,10,15,20,30,50];   /* 排行榜有名次的只有這些門檻 */
const S={page:"ov",subject:"",col:"all",per:"n0",from:"",to:"",fuTab:"op",fuSel:null,fuStep:null,game:null,move:0,ovMore:3,fuMore:3,
  numMode:"n5",showRec:true,
  trPath:[],trDepth:30,trMin:1,patLast:null,patTurn:"B",patHist:[],
  pat:[],patSeq:[],patColor:"auto",seMode:"local",seOrd:"any",seDepth:30,seMargin:2,seMore:30,seSwap:false,
  seP:"",sePC:"any",seOpp:"",seFrom:"",seTo:"",
  rdMode:"abs",rdBand:true,refAvg:true,refT10:true,refTop:true,rkMet:"Rt",rkMin:20,rkMore:50,rkJump:false,ovReg:[],cpA:"",cpB:"",cpFill:"B",
  /* 常用布局（卡片）與常用定石 */
  fuSort:"n",fuSortSaved:"n",opMin:2,opMore:12,opGame:null,opLv:4,rcF:null,opSrc:"me",opChain:[],opSel:"",opSelLv:0,opRow:null,
  jsSrc:"me",jsRole:"all",jsK:4,jsSort:"n",jsPath:"",jsNb:"",jsSel:null,jsStep:null,jsMore:12,jsThumbs:12,
  jsOri:"norm",jsCorner:1,jsBoard:"full",jsOth:false,jsCfgMore:8,jsCfgSort:"n",jsNote:"",jsLv:2,jsCt:"all",jsFollow:false};
const LSK="go-lab-v2";
try{
  const o=JSON.parse(localStorage.getItem(LSK+"-cfg")||"{}");
  /* mt（失著の判定幅）は内部の定義なので、古い保存値を復元しない。
     以前は [10,30,50] などで保存されており、CFG.mt.indexOf(5) が -1 になって落ちていた */
  /* omode／oself／depth（布局分組）已經沒有設定的地方，也不復原舊的保存值 */
  Object.keys(CFG).forEach(k=>{if(k!=="mt"&&k!=="omode"&&k!=="oself"&&k!=="depth"&&o[k]!==undefined)CFG[k]=o[k]});
  /* 失著門檻：設定頁改的值要留下來。只收 1–5 個 1–99 的數字，缺 5% 時下面會補上 */
  if(Array.isArray(o.mt)&&o.mt.length>=1&&o.mt.length<=5&&o.mt.every(v=>typeof v==="number"&&v>=1&&v<=99))CFG.mt=o.mt.slice();
  ["col","per","from","to","subject","numMode","showRec","cpA","cpB","cpFill","ovReg","rkMin","fuSort","jsSrc","jsK","jsOri","jsBoard","rdMode","rdBand","refAvg","refT10","refTop"].forEach(k=>{if(o[k]!==undefined)S[k]=o[k]});
  if(!Array.isArray(S.ovReg))S.ovReg=S.ovReg&&S.ovReg!=="all"?[S.ovReg]:[];   /* 旧形式（文字列）から移行 */
  S.fuSortSaved=S.fuSort;   /* 報告的連結會暫時改排序，存檔的是使用者自己選的 */
}catch(e){}
if(!Array.isArray(CFG.mt)||!CFG.mt.length)CFG.mt=[5,10,20,30,50];

/* 依輸入的字找棋士：完全吻合 → 開頭吻合 → 包含 → 異體字表沒收錄時用共同字比例 */
function suggestNames(q,lim=10){
  const f=foldName(q);if(!f)return [];
  const list=MODE==="sgf"?playerCounts():(INDEX?INDEX.players:[]);
  const hit=[],fz=[],qs=new Set(f);
  list.forEach(p=>{
    const g=foldName(p[0]);
    if(g===f)hit.push([p,0]);
    else if(g.startsWith(f))hit.push([p,1]);
    else if(g.indexOf(f)>=0)hit.push([p,2]);
    else{
      const gs=new Set(g);let c=0;qs.forEach(x=>{if(gs.has(x))c++});
      const sc=c/Math.max(qs.size,gs.size);
      if(c&&sc>=0.34)fz.push([p,3-sc]);
    }
  });
  const by=(a,b)=>a[1]-b[1]||b[0][1]-a[0][1];
  return hit.sort(by).concat(fz.sort(by)).slice(0,lim).map(x=>x[0]);
}

function attachSuggest(inp,pick){

  const box=document.createElement("div");box.className="sugbox";box.hidden=true;box._inp=inp;
  inp.parentNode.style.position="relative";inp.parentNode.appendChild(box);
  let items=[],cur=-1;
  const close=()=>{box.hidden=true;cur=-1};
  const draw=()=>{
    items=inp.value.trim()?suggestNames(inp.value,10):[];
    if(!items.length){close();return}
    box.innerHTML=items.map((p,i)=>`<button type="button" data-i="${i}"><span>${esc(p[0])} ${MODE==="data"?regTag(p[0]):""}</span><span class="sub">${p[1]} 局</span></button>`).join("");
    box.hidden=false;cur=-1;
  };
  const choose=i=>{const p=items[i];if(!p)return;inp.value=p[0];close();pick(p[0])};
  inp.addEventListener("input",draw);
  inp.addEventListener("focus",draw);
  inp.addEventListener("blur",()=>setTimeout(close,180));
  inp.addEventListener("keydown",e=>{
    if(box.hidden)return;
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){
      e.preventDefault();cur=(cur+(e.key==="ArrowDown"?1:items.length-1)+items.length)%items.length;
      [...box.children].forEach((b,i)=>b.classList.toggle("on",i===cur));
      if(box.children[cur])box.children[cur].scrollIntoView({block:"nearest"});
    }else if(e.key==="Enter"&&cur>=0){e.preventDefault();choose(cur)}
    else if(e.key==="Escape")close();
  });

}

function parseRE(re,sc){

  const m=/^([BW黑白])\s*\+\s*(.*)$/i.exec(t);
  if(!m)return{win:null,txt:t,margin:null};
  const w=({"黑":"B","白":"W"}[m[1]]||m[1].toUpperCase()),rest=(m[2]||"").trim(),win=(w===sc),sfx=win?"勝":"負";
  if(/^r/i.test(rest)||/中/.test(rest))return{win,txt:"中盤"+sfx,margin:null};
  if(/^t/i.test(rest))return{win,txt:"超時"+sfx,margin:null};
  if(/^f/i.test(rest))return{win,txt:"犯規"+sfx,margin:null};
  const v=parseFloat(rest);
  if(isFinite(v))return{win,txt:sfx+v+"目",margin:v};
  return{win,txt:sfx,margin:null};
}

/* 棋界的慣例是黑棋第一手下在右上角。極少數棋譜不是這樣（或記錄時轉了方向），一律轉成第一手在右上角，
   所有的圖（棋盤、縮圖、定石、布局）都以這個方向為準。第一手在天元或邊上（中線上）的不轉 */
function frameT(first){
  if(!first)return 0;
  const[x,y]=xy(first);
  if(x<0||y<0||x>18||y>18||x===9||y===9)return 0;
  return (x<9?1:0)|(y>9?2:0);   /* t&1 左右翻、t&2 上下翻 → 右上 */
}
const tPt=(p,t)=>{if(!p||!t||p.length<2)return p;const[x,y]=xy(p);if(x<0||y<0||x>18||y>18)return p;const[a,b]=symXY(x,y,19,t);return String.fromCharCode(97+a,97+b)};
function frameRaw(g){
  if(!g||g.sz!==19)return g;
  const b=g.moves.find(m=>m.c==="B"&&m.p),t=frameT(b&&b.p);
  if(!t)return g;
  g.moves.forEach(m=>{m.p=tPt(m.p,t);if(m.best)m.best=tPt(m.best,t);(m.cands||[]).forEach(c=>{c.p=tPt(c.p,t)})});
  g.setup.forEach(st=>{st.p=tPt(st.p,t)});
  g.frameT=t;
  return g;
}

const frameM=m=>{const f=m.substr(0,2),t=f&&f!=="--"?frameT(f):0;if(!t)return m;let o="";for(let i=0;i<m.length;i+=2){const q=m.substr(i,2);o+=q==="--"?q:tPt(q,t)}return o};
function decodeGame(r){
  const n=r.n,moves=[];
  for(let k=0;k<n;k++){
    const pt=r.m.substr(k*2,2);
    const w=d2(r.v.substr(k*2,2));
    const sc=d1(r.s[k]),rk=d1(r.q[k]);
    const sv=r.sr&&r.sr[k]&&r.sr[k]!=="."?+r.sr[k]:null;
    const o=k*12,mc=k%2===0?"B":"W";
    const c1p=r.a.substr(o,2),c1w=wrv(r.a.substr(o+2,2));
    const cands=[];
    if(c1p!=="--"&&c1w!=null){
      cands.push({p:c1p,bw:c1w});
      [[o+4,o+6],[o+7,o+9]].forEach(([pp,dd])=>{
        const q=r.a.substr(pp,2),d=d1(r.a[dd]);
        if(q!=="--"&&d!=null)cands.push({p:q,bw:mc==="B"?c1w-d/2:c1w+d/2});
      });
    }
    moves.push({p:pt==="--"?null:pt,c:mc,
      w:w==null?null:w/10,score:sc==null?null:sc-32,rank:rk,srank:sv,
      best:c1p==="--"?null:c1p,bw:c1w,pw:wrv(r.a.substr(o+10,2)),cands});
  }
  return frameRaw({file:"",sz:19,pb:r.b,pw:r.w,br:r.br,wr:r.wr,dt:r.d,evt:r.e,re:r.r,km:r.k,setup:[],moves,w0:null,pov:"B",evalBefore:true});
}

   SGF 解析
   ============================================================ */
function sgfTrees(src){
  let i=0;
  const ws=()=>{while(i<src.length&&/\s/.test(src[i]))i++};
  function props(){
    const p={};ws();
    while(i<src.length&&/[A-Za-z]/.test(src[i])){
      let id="";
      while(i<src.length&&/[A-Za-z]/.test(src[i])){id+=src[i];i++}
      id=id.replace(/[^A-Z]/g,"");
      const vs=[];ws();
      while(src[i]==="["){
        i++;let v="";
        while(i<src.length&&src[i]!=="]"){
          if(src[i]==="\\"){i++;if(src[i]==="\n"){i++;continue}v+=(src[i]||"");i++}
          else{v+=src[i];i++}
        }
        i++;vs.push(v);ws();
      }
      if(id)p[id]=vs;
      ws();
    }
    return p;
  }
  function tree(){
    ws();if(src[i]!=="(")return null;i++;
    let root=null,cur=null;ws();
    while(src[i]===";"){
      i++;const n={p:props(),ch:[]};
      if(!root){root=n}else{cur.ch.push(n)}
      cur=n;ws();
    }
    if(!root){root={p:{},ch:[]};cur=root}
    ws();
    while(src[i]==="("){
      const st=i;const t=tree();
      if(t)cur.ch.push(t);
      if(i<=st){i++;break}
      ws();
    }
    ws();if(src[i]===")")i++;
    return root;
  }
  const out=[];ws();
  while(i<src.length){
    if(src[i]!=="("){i++;continue}
    const st=i;const t=tree();
    if(t)out.push(t);
    if(i<=st)break;
    ws();
  }
  return out;
}

    const mkey=t=>{let a=pts.map(([x,y,c])=>{const[u,v]=symXY(x,y,g.sz,t);return c+String.fromCharCode(97+u,97+v)});if(self)a=a.sort();return a.join("")};
    let key=null;
    if(g.sz===19){
      let t=null;
      if(self){
        /* 右上那一子決定（黑子在右下半邊、白子在左上半邊）；它在對角線上時，看落在自己那一邊的子多的方向；一樣多就取字串小的 */
        const tr=pts.find(([x,y])=>x>9&&y<9);
        if(tr&&tr[0]+tr[1]!==18)t=(tr[0]+tr[1]>18)===(tr[2]==="B")?0:7;
        else{const sc=u=>pts.reduce((a,[x,y,c])=>{const[e,f]=symXY(x,y,19,u);return a+(e+f!==18&&(e+f>18)===(c==="B")?1:0)},0),s0=sc(0),s7=sc(7);if(s0!==s7)t=s0>s7?0:7}
      }
      else t=frameT2(pts);
      key=t!=null?mkey(t):[mkey(0),mkey(7)].sort()[0];
    }else for(let t=0;t<8;t++){const s=mkey(t);if(key===null||s<key)key=s}
    const mk=g.sz+":"+key;
    if(!map.has(mk)){
      const txt=(self?keyStones(key).map(s=>[s.x,s.y,s.c]):pts).map(([x,y,c])=>(c==="B"?"●":"○")+ptName(x,y,g.sz)).join(" ");
      let label=txt,name=null;
      if(self){
        name=g.sz===19?fusekiName3(keyStones(key)):null;
        label=(g.c==="B"?"執黑 ":"執白 ")+(name||txt);
      }
      map.set(mk,{key,sz:g.sz,c:self?g.c:null,label,name,txt,games:[],ori:new Map()});
    }
    const og=map.get(mk);og.games.push(g);
    /* 圖要畫成實戰最常見的方向：記下這一局原本的方向（mkey(0) 一定是 key 或它的鏡像） */
    if(self&&g.sz===19){const r=mkey(0);og.ori.set(r,(og.ori.get(r)||0)+1)}
  });
  OPEN=[...map.values()].sort((a,b)=>b.games.length-a.games.length);
  OPEN.forEach(o=>{o.dk=o.key;let b=o.ori.get(o.key)||0;o.ori.forEach((n,k)=>{if(n>b){b=n;o.dk=k}})});
  /* 顏色只給最常下的 12 種，其他一律灰色（顏色不夠分，輪替使用會讓不同布局撞色） */

function boardAt(g,n){
  const sz=g.sz,b=new Int8Array(sz*sz),num=new Int32Array(sz*sz);
  const ix=(x,y)=>y*sz+x;
  g.setup.forEach(s=>{const[x,y]=xy(s.p);if(x>=0&&y>=0&&x<sz&&y<sz)b[ix(x,y)]=s.c==="B"?1:2});
  const nb=(x,y)=>{const o=[];if(x>0)o.push([x-1,y]);if(x<sz-1)o.push([x+1,y]);if(y>0)o.push([x,y-1]);if(y<sz-1)o.push([x,y+1]);return o};
  const seen=new Int32Array(sz*sz);let mark=0;
  function group(x,y){
    const c=b[ix(x,y)],st=[[x,y]],out=[];let lib=false;mark++;seen[ix(x,y)]=mark;
    while(st.length){
      const[cx,cy]=st.pop();out.push([cx,cy]);
      for(const[nx,ny]of nb(cx,cy)){
        const j=ix(nx,ny);
        if(b[j]===0)lib=true;
        else if(b[j]===c&&seen[j]!==mark){seen[j]=mark;st.push([nx,ny])}
      }
    }
    return{out,lib};
  }
  let last=null;
  for(let k=0;k<n&&k<g.len;k++){
    const m=g.moves[k];if(!m.p){last=null;continue}
    const[x,y]=xy(m.p);
    if(x<0||y<0||x>=sz||y>=sz){last=null;continue}
    const me=m.c==="B"?1:2;
    b[ix(x,y)]=me;num[ix(x,y)]=k+1;last=[x,y];
    for(const[nx,ny]of nb(x,y)){
      const j=ix(nx,ny);
      if(b[j]&&b[j]!==me){const G=group(nx,ny);if(!G.lib)G.out.forEach(([ax,ay])=>{b[ix(ax,ay)]=0;num[ix(ax,ay)]=0})}
    }
    const G=group(x,y);
    if(!G.lib){G.out.forEach(([ax,ay])=>{b[ix(ax,ay)]=0;num[ix(ax,ay)]=0});last=null}
  }
  return{b,num,last,sz};
}

/* 以「哪一方贏」表示勝敗，而不是從研究對象的角度 */
function resultFull(re){
  const t=cleanName(re);
  if(!t)return "結果不明";
  if(/^(0|draw|jigo|和|和局|持碁)$/i.test(t))return "和局";
  if(/^(void|無效)$/i.test(t))return "無勝負";
  const m=/^([BW黑白])\s*\+\s*(.*)$/i.exec(t);
  if(!m)return t;
  const w=(({"黑":"B","白":"W"}[m[1]])||m[1].toUpperCase())==="B"?"黑":"白";
  const rest=(m[2]||"").trim();
  if(/^r/i.test(rest)||/中/.test(rest))return w+"中盤勝";
  if(/^t/i.test(rest))return w+"時間勝";
  if(/^f/i.test(rest))return w+"反則勝";
  const v=parseFloat(rest);
  return isFinite(v)?w+v+"目勝":w+"勝";
}

    const n=list.length||1;
    const m=list.reduce((a,g)=>a+g.mist.filter(x=>x.ph===p).length,0);
    const big=list.reduce((a,g)=>a+g.mist.filter(x=>x.ph===p&&x.drop>=CFG.th2).length,0);
    let ls=0,lc=0,as=0,a3=0,ac=0,nn=0,s1=0,s3=0,sn=0,kn=0;
    const mc=CFG.mt.map(()=>0),kc=CFG.mt.map(()=>0);
    list.forEach(g=>{ls+=g.lSum[p];lc+=g.lCnt[p];as+=g.aSum[p];a3+=g.a3Sum[p];ac+=g.aCnt[p];nn+=g.nC[p];
      s1+=g.sSum[p];s3+=g.s3Sum[p];sn+=g.sCnt[p];
      kn+=g.kC[p];
      CFG.mt.forEach((t,i)=>{mc[i]+=g.mtC[i][p];kc[i]+=g.ktC[i][p]})});
    return{p,m:m/n,big:big/n,loss:lc?ls/lc:null,agree:ac?as/ac*100:null,agree3:ac?a3/ac*100:null,
      sr1:sn?s1/sn*100:null,sr3:sn?s3/sn*100:null,
      mr:mc.map(c=>nn?c/nn*100:null),mpg:mc.map(c=>c/n),mn:mc,nn,

/* 內容太長時整張縮小到一頁（.a4in 的高度 > 紙張扣掉邊界）。這個函式也原樣放進下載的 HTML 檔 */

  for(let i=0;i<=4;i++){const t=lo+(hi-lo)*i/4;h+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)"/><text x="${pl-6}" y="${Y(t)+4}" text-anchor="end" font-size="10" fill="var(--faint)" font-family="IBM Plex Mono,monospace">${Math.round(t)}%</text>`}
  h+=`<path d="M${X(0)} ${Y(v[0])}${v.map((y,i)=>` L${X(i)} ${Y(y)}`).join("")} L${X(v.length-1)} ${H-pb} L${X(0)} ${H-pb}Z" fill="var(--accent)" opacity=".08"/>`;
  h+=`<polyline points="${v.map((y,i)=>X(i)+","+Y(y)).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="1.6"/>`;
  a.forEach((g,i)=>h+=`<circle cx="${X(i)}" cy="${Y(v[i])}" r="${click&&g.id===S.game?5:3.2}" fill="${g.win===true?"var(--good)":g.win===false?"var(--bad)":"var(--faint)"}" ${click?`data-tg="${g.id}" style="cursor:pointer" stroke="${g.id===S.game?"var(--ink)":"none"}" stroke-width="1.5"`:""}><title>${fmtD(g.date)} vs ${esc(g.opp)} ${esc(g.res)} · 吻合度 ${v[i]==null?"—":Math.round(v[i])+"%"}</title></circle>`);
  h+=`<text x="${pl}" y="${H-6}" font-size="10" fill="var(--faint)" font-family="IBM Plex Mono,monospace">${fmtS(a[0].date)}</text><text x="${W-pr}" y="${H-6}" text-anchor="end" font-size="10" fill="var(--faint)" font-family="IBM Plex Mono,monospace">${fmtS(a[a.length-1].date)}</text>`;
  return h+"</svg>";
}

/* ============================================================
   布局研究
   分頁：常用布局（縮圖卡片）／常用定石（角的部分圖＋一手一手查詢）／布局樹／近期對局
   ============================================================ */
let FU_KEYS=null;
document.addEventListener("keydown",e=>{if(FU_KEYS)FU_KEYS(e)});
const FUT=[["op","常用布局"],["js","常用定石"],["tree","布局樹"],["recent","近期對局"]];
const fuTabs=()=>`<div class="tabs" id="fuTabs">${FUT.map(([k,l])=>`<button data-t="${k}" class="${S.fuTab===k?"on":""}">${l}</button>`).join("")}</div>`;
function bindFuTabs(el){
  el.querySelectorAll("#fuTabs button").forEach(b=>b.onclick=()=>{S.fuTab=b.dataset.t;S.fuSel=null;S.fuStep=null;S.rcF=null;renderFU()});
}
const resCls=g=>g.win===true?"res-w":g.win===false?"res-l":"sub";
const pctCls=w=>w==null?"sub":w>=50?"res-w":"res-l";
const segHTML=(id,cur,opts)=>`<div class="seg" id="${id}" role="group">${opts.map(([k,l])=>`<button data-v="${k}" class="${String(cur)===String(k)?"on":""}">${l}</button>`).join("")}</div>`;
/* 點了卡片之後，下方的詳細區塊不在畫面裡才捲過去（頁首是固定的，要扣掉它的高度） */
const revealEl=id=>{
  const d=document.getElementById(id);if(!d)return;
  const stk=[document.querySelector("header.top"),document.getElementById("nav")].find(e=>e&&getComputedStyle(e).position==="sticky"&&e.getBoundingClientRect().height>0);
  const r=d.getBoundingClientRect(),off=(stk?stk.getBoundingClientRect().height:0)+12;
  if(r.top>innerHeight*.7||r.top<off)scrollTo({top:r.top+scrollY-off,behavior:"smooth"});
};
/* 盤上「下一手」標記用的字母（棋書的慣例：盤上的數字是手順，選項用 A、B、C） */
const MKL="ABCDEFGHIJ";

/* 縮圖用的小棋盤：平面著色、不用漸層與陰影，一頁放幾十張也不會慢。
   stones=[{x,y,c,n,r}]（r＝這顆子的半徑，以路寬計；不給就照 o 決定）；o.nums 顯示手順、o.last 標最後一手、o.icon 小圖示（棋子畫大一點）、o.sz 路數 */
function miniSVG(stones,o={}){
  const sz=o.sz||19,G=180/(sz-1),M=6,Sz=M*2+180,X=v=>M+v*G,R=o.big?G*1.45:o.icon?G*.82:G*.56;
  let h=`<svg viewBox="0 0 ${Sz} ${Sz}" class="mini" role="img" aria-label="${esc(o.label||"棋盤縮圖")}"><rect width="${Sz}" height="${Sz}" rx="5" fill="var(--wood)"/>`;
  let ln="";for(let i=0;i<sz;i++)ln+=`M${X(0)} ${X(i)}H${X(sz-1)}M${X(i)} ${X(0)}V${X(sz-1)}`;
  h+=`<path d="${ln}" fill="none" stroke="#3a2408" stroke-opacity="${o.icon?.3:.5}" stroke-width="${o.icon?.8:.6}"/>`;
  if(!o.icon){const hs=HOSHI(sz).filter(v=>Number.isInteger(v));hs.forEach(a=>hs.forEach(b=>h+=`<circle cx="${X(a)}" cy="${X(b)}" r="1.3" fill="#3a2408" fill-opacity=".7"/>`))}
  stones.forEach(s=>{
    const bl=s.c==="B";
    h+=`<circle cx="${X(s.x)}" cy="${X(s.y)}" r="${s.r?G*s.r:R}" fill="${bl?"#1C1C1E":"#F8F6EF"}" stroke="${bl?"#000":"#5a5446"}" stroke-width="${o.icon?1.6:.7}"/>`;
    if(o.nums&&s.n)h+=`<text x="${X(s.x)}" y="${X(s.y)+G*.27}" text-anchor="middle" font-size="${s.n>=10?G*.6:G*.76}" font-weight="700" font-family="IBM Plex Mono,monospace" fill="${bl?"#fff":"#111"}">${s.n}</text>`;
  });
  if(o.last){const[x,y]=o.last;h+=`<circle cx="${X(x)}" cy="${X(y)}" r="${G*.22}" fill="#D2463A"/>`}
  return h+"</svg>";
}
/* 布局分組的 key（「B」「W」＋座標，每 3 字一手）還原成棋子 */
const keyStones=key=>{const o=[];for(let i=0;i+2<key.length;i+=3){const[x,y]=xy(key.substr(i+1,2));o.push({x,y,c:key[i],n:o.length+1})}return o};
const opIcon=o=>`<span class="oicon" style="border-color:${o.col}">${miniSVG(keyStones(o.dk||o.key),{icon:true,sz:o.sz,label:o.label})}</span>`;

/* 棋譜檢視器（布局研究各分頁共用）：pre＝元素 id 的前綴，st＝S 裡記手數的欄位名 */
function vwHTML(pre,g,foot){
  return `${gameHeader(g)}<div id="${pre}Bar"></div><div id="${pre}Board"></div><div id="${pre}Leg"></div>
  <div class="ctrl"><input type="range" id="${pre}Step" min="0" max="${g.len}" step="1" aria-label="手數"><span class="num sub" id="${pre}Out" style="min-width:80px;text-align:right"></span></div>
  <div class="ctrl nav5" id="${pre}Nav" role="group" aria-label="棋譜操作"><button data-nv="first" aria-label="回到開始">|‹</button><button data-nv="-10" aria-label="後退十手">‹‹ 10</button><button data-nv="-1" aria-label="上一手">‹ 1</button><button data-nv="1" aria-label="下一手">1 ›</button><button data-nv="10" aria-label="前進十手">10 ››</button><button data-nv="last" aria-label="到最後">›|</button></div>
  <div class="ctrl" style="justify-content:center">${numSel(pre+"Num")}${sgfBtn(pre+"Sgf")}</div>
  <div class="cap" id="${pre}Cap"></div>${foot||""}`;
}
function vwBind(pre,g,st,o={}){
  const max=g.len,q=id=>document.getElementById(pre+id);
  if(!q("Board"))return;
  if(S[st]==null||S[st]>max)S[st]=Math.min(o.start!=null?o.start:CFG.p1,max);
  const draw=()=>{
    const n=S[st],cands=nextCands(g,n);
    q("Bar").innerHTML=wrBar(g,n);
    q("Board").innerHTML=boardSVG(g,n,{...numOpts(n),cands});
    q("Leg").innerHTML=candLegend(cands.length>0);
    q("Step").value=n;
    q("Out").textContent=`第 ${n} / ${max} 手`;
    const m=(g.mist||[]).find(x=>x.k+1===n);
    q("Cap").innerHTML=`${PH[n?phaseOf(n):0]}${g.hasWR?` · 勝率 <span class="num">${g.wr[n].toFixed(1)}%</span>`:""}${m?` · <span style="color:var(--bad)">失著 −${m.drop}%</span>`:""}`;
  };
  const set=v=>{S[st]=Math.max(0,Math.min(max,v));draw()};
  q("Num").onchange=e=>{S.numMode=e.target.value;saveLS();draw()};
  q("Sgf").onclick=e=>sgfDownload(g,e.currentTarget);
  q("Step").oninput=e=>set(+e.target.value);
  q("Nav").querySelectorAll("button").forEach(b=>b.onclick=()=>{const v=b.dataset.nv;set(v==="first"?0:v==="last"?max:S[st]+(+v))});
  FU_KEYS=e=>{
    if(S.page!=="fu"||/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)||!document.getElementById(pre+"Board"))return;
    if(e.key==="ArrowRight"){set(S[st]+1);e.preventDefault()}else if(e.key==="ArrowLeft"){set(S[st]-1);e.preventDefault()}
  };
  draw();
}

function renderFU(){
  const el=document.getElementById("page-fu");
  FU_KEYS=null;
  /* 舊的分頁名稱（報告裡的連結）對應到新的「常用布局」＋排序；這種暫時的排序不存檔 */
  if(S.fuTab==="hi"||S.fuTab==="lo"){S.fuSort=S.fuTab;S.fuTab="op"}
  if(!FUT.some(t=>t[0]===S.fuTab))S.fuTab="op";
  if(!GAMES.length){el.innerHTML=emptyPanel(DSERR||"選擇研究對象，或載入 SGF 棋譜。");bindEmpty(el);return}
  const L=gs();
  /* 常用定石自己會處理「沒有對局」（還可以切到全部棋譜） */
  if(!L.length&&S.fuTab!=="js"){
    el.innerHTML=`<section class="panel"><div class="panel-h"><h2>布局研究</h2></div>${fuTabs()}<p class="sub">這個條件下沒有對局。</p></section>`;
    bindFuTabs(el);return;
  }
  if(S.fuTab==="tree")return renderTree(el,L);
  if(S.fuTab==="js")return renderJS(el,L);
  if(S.fuTab==="recent")return renderRecent(el,L);
  return renderOP(el,L);
}

/* ---------- 常用布局 ----------
   布局檢索：雙方前 4／10／20 手的「全盤配置」。手順不同、配置一樣的算同一種（同形合併）；
   方向一律黑第一手在右上（只在原樣與沿右上對角線翻兩種裡選）。點卡片＝走到那個布局，下一段只列出接在它後面的變化。
   另外保留「自己的子」：只看研究對象自己的前幾子（有布局名稱） */
const OPLV=[4,10,20];
/* get(k)＝第 k 手 {p,c}；回傳 {key＝排序過的子（同形合併用）, seq＝這一局的手順（同樣的方向）} */
function opKey(get,len,N){
  if(len<N)return null;
  const st=[];for(let k=0;k<N;k++){const m=get(k);if(m&&m.p)st.push([...xy(m.p),m.c])}
  if(!st.length)return null;
  const mk=t=>st.map(([x,y,c])=>{const[a,b]=symXY(x,y,19,t);return c+String.fromCharCode(97+a,97+b)});
  const A=mk(0),B=mk(7),ka=A.slice().sort().join(""),kb=B.slice().sort().join("");
  return{key:ka<=kb?ka:kb,seq:(oriFlip(A)?B:A).join("")};
}
/* 資料：研究對象的對局（期間、執子篩選後），或全部棋譜（布局索引的前 50 手） */
const OPK=new WeakMap();
let RAWROWS=null;
const rawRows=()=>{if(!RAWROWS||RAWROWS.src!==RAW||RAWROWS.n!==RAW.length)RAWROWS={src:RAW,n:RAW.length,rows:RAW.map(g=>({d:g.dt,b:g.pb,w:g.pw,r:g.re,raw:g}))};return RAWROWS.rows};
function opItems(L,all){
  if(all){
    const rows=MODE==="data"?(OPENROWS||[]):rawRows();
    let c=OPK.get(rows);
    if(!c){c=rows.filter(r=>!r.raw||r.raw.sz===19).map(r=>{
      const len=r.raw?r.raw.moves.length:r.m.length/2;
      const get=r.raw?(k=>r.raw.moves[k]):(k=>{const p=r.m.substr(k*2,2);return{p:p==="--"?null:p,c:k%2===0?"B":"W"}});
      return{r,len,get,win:winBof(r.r),dt:r.d||"",k:{}}});c.forEach((x,i)=>x.i=i);OPK.set(rows,c)}
    return c;
  }
  return L.filter(g=>g.sz===19).map((g,i)=>({g,i,len:g.len,get:k=>g.moves[k],win:g.win,c:g.c,dt:g.dt||"",k:{}}));
}
const opK=(it,N)=>{if(!(N in it.k))it.k[N]=opKey(it.get,it.len,N);return it.k[N]};
const flip7=g=>({...g,setup:(g.setup||[]).map(q=>({...q,p:tPt(q.p,7)})),
  moves:g.moves.map(m=>({...m,p:tPt(m.p,7),best:m.best&&tPt(m.best,7),cands:m.cands&&m.cands.map(c=>({...c,p:tPt(c.p,7)}))})),
  mist:(g.mist||[]).map(x=>({...x,rec:x.rec&&tPt(x.rec,7)}))});
const seqStones=seq=>{const o=[];for(let i=0;i+2<seq.length;i+=3){const[x,y]=xy(seq.substr(i+1,2));o.push({x,y,c:seq[i],n:o.length+1})}return o};
function renderOP(el,L){
  const all=S.opSrc==="all";
  if(all&&MODE==="data"&&!OPENROWS&&!OPENERR){
    el.innerHTML=`<section class="panel"><div class="panel-h"><h2>布局研究</h2></div>${fuTabs()}<p class="sub">載入全部棋譜的布局資料（${INDEX?INDEX.n.toLocaleString():""} 局，約 1.2 MB）…</p></section>`;
    bindFuTabs(el);
    loadOpenIdx().then(()=>{if(S.page==="fu"&&S.fuTab==="op")renderFU()});
    return;
  }
  const items=opItems(L,all),srt=S.fuSort;
  /* 「接在目前的布局之後」：一路點下來的每一段都要符合（S.opChain＝[{lv,key}]），卡片上的局數和點進去之後的局數才會一致 */
  if(!Array.isArray(S.opChain))S.opChain=[];
  let base=items.filter(it=>S.opChain.every(c=>{const k=opK(it,c.lv);return k&&k.key===c.key}));
  if(S.opChain.length&&!base.length){S.opChain=[];base=items}
  const follow=S.opChain.length>0,lastLv=follow?S.opChain[S.opChain.length-1].lv:0;
  let N=OPLV.includes(S.opLv)?S.opLv:4;
  if(follow&&N<=lastLv)N=OPLV.find(v=>v>lastLv)||20;
  const winLab=all?"黑勝率":`${who()} 的勝率`;
  /* 分組 */
  const m=new Map();
  base.forEach((it,i)=>{const k=opK(it,N);if(!k)return;let e=m.get(k.key);
    if(!e){e={key:k.key,n:0,w:0,d:0,nb:0,seqs:new Map(),its:[]};m.set(k.key,e)}
    e.n++;if(it.win===true)e.w++;if(it.win!=null)e.d++;if(it.c==="B")e.nb++;
    e.seqs.set(k.seq,(e.seqs.get(k.seq)||0)+1);e.its.push(it)});
  let fs=[...m.values()];
  const short=base.length-fs.reduce((a,e)=>a+e.n,0);
  let hidden="";
  /* 全部棋譜的 10、20 手幾乎每局都不一樣：一開始不列只出現 1 次的（接在某個布局之後時全部列出，等於是那些實戰的清單） */
  if(all&&N>=10&&!follow){const one=fs.filter(e=>e.n<2).length;if(one&&one<fs.length){fs=fs.filter(e=>e.n>=2);hidden=`另有 ${one.toLocaleString()} 種只出現 1 次（沒有列出；先選一個 4 手或 10 手的布局，就會列出接在它後面的每一局）。`}}
  if(srt!=="n")fs=fs.filter(e=>e.d>0&&e.n>=S.opMin);
  const wr=e=>e.d?e.w/e.d*100:null;
  if(srt==="hi")fs.sort((a,b)=>wr(b)-wr(a)||b.n-a.n);
  else if(srt==="lo")fs.sort((a,b)=>wr(a)-wr(b)||b.n-a.n);
  else fs.sort((a,b)=>b.n-a.n||(a.key<b.key?-1:1));
  const show=fs.slice(0,S.opMore);
  /* 下方列出實戰的布局：點了 20 手的卡片就是那一張；否則是目前跟著的布局（沒有跟著時是第一張） */
  let selLv,selKey,selItems;
  if(S.opSel&&S.opSelLv===N&&m.has(S.opSel)){selKey=S.opSel;selLv=N;selItems=m.get(selKey).its}
  else if(follow){selKey="";selLv=lastLv;selItems=base}
  else{const f0=fs[0];selKey=f0?f0.key:"";selLv=N;selItems=f0?f0.its:[]}
  /* 同形合併的一組裡，少數對局是另一個方向（轉置之後第一個離開對角線的子不同）。
     接在某個布局之後時，卡片一律畫成和那個布局同一個方向；沒有接時取這一組多數的方向。下方的實戰也轉成和卡片同一個方向 */
  const seqSet=q=>{const a=[];for(let i=0;i+2<q.length;i+=3)a.push(q.substr(i,3));return a.sort().join("")};
  const seqT7=q=>q.replace(/([BW])([a-s]{2})/g,(_,c,p)=>c+tPt(p,7));
  const lastC=follow?S.opChain[S.opChain.length-1]:null;
  const followTxt=follow?(lastC.seq||(()=>{const c=new Map();base.forEach(it=>{const k=opK(it,lastLv);if(k)c.set(k.seq,(c.get(k.seq)||0)+1)});const t=[...c.entries()].sort((a,b)=>b[1]-a[1])[0];return t?t[0]:""})()):"";
  const fitE=e=>{
    if(e.fs)return e.fs;
    let ok;
    if(followTxt&&seqSet(followTxt)!==seqSet(seqT7(followTxt))){const f=seqSet(followTxt),L=followTxt.length;ok=q=>seqSet(q.slice(0,L))===f}
    else{const c=new Map();e.seqs.forEach((n,q)=>{const k=seqSet(q);c.set(k,(c.get(k)||0)+n)});const ref=[...c.entries()].sort((a,b)=>b[1]-a[1])[0][0];ok=q=>seqSet(q)===ref}
    const o=new Map();e.seqs.forEach((n,q)=>{const f=ok(q)||!ok(seqT7(q))?q:seqT7(q);o.set(f,(o.get(f)||0)+n)});
    return e.fs=o;
  };
  const repSeq=e=>[...fitE(e).entries()].sort((a,b)=>b[1]-a[1])[0][0];
  const card=(e,i)=>{const w=wr(e),on=selLv===N&&selKey===e.key;
    return `<button class="ocard${on?" on":""}" data-opk="${e.key}" data-ops="${repSeq(e)}" aria-pressed="${on}">
      <div class="oc-h"><b>${i+1}</b>${all?"":pcolHTML(e.nb,e.n,"局")}<span class="sub num">${e.n} 局 · ${Math.round(e.n/(base.length||1)*100)}%</span></div>
      ${miniSVG(seqStones(repSeq(e)),{nums:true,label:`前 ${N} 手的布局`})}
      <div class="oc-s"><span class="num ${all?"":pctCls(w)}">${w==null?winLab+" —":(all?"黑勝 ":"勝率 ")+Math.round(w)+"%"}</span><span class="sub num">${e.w} 勝 ${e.d-e.w} 敗</span></div>
      <div class="meter"><i style="width:${w||0}%;background:${w==null?"var(--faint)":all?"var(--accent)":w>=50?"var(--good)":"var(--bad)"}"></i></div>
      ${fitE(e).size>1?`<div class="sub">手順 ${fitE(e).size} 種（同形合併）</div>`:""}</button>`};
  let h=`<section class="panel"><div class="panel-h"><h2>布局研究</h2><p>${all?"全部棋譜":`${who()} 的對局（${S.col==="all"?"執黑、執白":S.col==="B"?"僅執黑":"僅執白"}）`} · ${items.length.toLocaleString()} 局</p></div>
  ${fuTabs()}
  <div class="fu-ctl">
    <span class="segw"><span class="seglab">資料</span>${segHTML("opSrc",S.opSrc,[["me",who()],["all",MODE==="data"?"全部棋譜":"全部載入的棋譜"]])}</span>
    <span class="segw"><span class="seglab">檢索</span>${segHTML("opLv",N,OPLV.filter(v=>!follow||v>lastLv).map(v=>[v,`雙方前 ${v} 手`]))}</span>
    <span class="segw"><span class="seglab">排序</span>${segHTML("opSort",srt,[["n","最常下"],["hi","勝率高"],["lo","勝率低"]])}</span>
    ${srt!=="n"?`<label class="sub">至少 <select id="opMin" class="numsel">${[1,2,3,5].map(v=>`<option value="${v}"${S.opMin===v?" selected":""}>${v} 局</option>`).join("")}</select></label>`:""}
  </div>

/* ============================================================
   常用定石
   每個角（含中線共 10×10 路）在前 50 手內依序下的著手，視為那個角的一組定石。
   棋譜都已經轉成黑第一手在右上角（棋界的慣例）。
   「四個角合併」：其他角的同形也算進來，一律轉到右上角來比較；先在這個角落子的一方記為 X（佔角方，畫成黑子）、另一方 O（進角方）。
   「只看一個角」：不旋轉也不翻轉，黑白照實戰，只看選的那個角。
   ============================================================ */
const JLIM=50,JMAX=30,JBOX=9;
const JANCH=[[0,0],[18,0],[0,18],[18,18]];   /* 左上、右上、左下、右下 */
const JCN=["左上","右上","左下","右下"];
/* 把各角轉到右上角的對稱變換：每個角各有 2 種（原樣，或沿右上的對角線翻轉） */
const JTO=JANCH.map(([x,y])=>{const r=[];for(let t=0;t<8;t++){const[a,b]=symXY(x,y,19,t);if(a===18&&b===0)r.push(t)}return r});
/* 右上角沿對角線翻轉（左上角與右下角對調） */
const jRefl=(x,y)=>[18-y,18-x];
function jCorner(x,y,last){
  const cx=[],cy=[];
  if(x<=JBOX)cx.push(0);if(x>=18-JBOX)cx.push(1);
  if(y<=JBOX)cy.push(0);if(y>=18-JBOX)cy.push(1);
  const cs=[];cy.forEach(b=>cx.forEach(a=>cs.push(b*2+a)));
  if(cs.length===1)return cs[0];
  /* 中線上的點同時屬於兩個角：算給最近有動靜的那個角；兩邊都還沒下過就不算 */
  const act=cs.filter(c=>last[c]>=0);
  return act.length?act.reduce((a,b)=>last[b]>last[a]?b:a):-1;
}
/* moves＝[{p,c}]（已經是黑第一手在右上的方向）。回傳每個有下過的角：
   str＝合併用：轉到右上之後的手順（每 3 字一手：X/O＋座標）。兩種轉法裡，用 oriFlip 選實戰常見的那一種
        （角上第一子的小目是 R16、掛角從上邊來，例外見 ORI_JS），前半相同的定石也會收在同一個分枝；
   rstr＝只看一個角用：實戰的座標與黑白（B/W＋座標）；ks＝每一手在整局中的手數（0 起算）；more＝這個角超過 JMAX 手 */
function jExtract(moves){
  const seq=[[],[],[],[]],last=[-1,-1,-1,-1],cnt=[0,0,0,0];
  const n=Math.min(JLIM,moves.length);
  for(let k=0;k<n;k++){
    const m=moves[k];if(!m||!m.p)continue;
    const[x,y]=xy(m.p);if(!(x>=0&&y>=0&&x<19&&y<19))continue;
    const q=jCorner(x,y,last);if(q<0)continue;
    last[q]=k;cnt[q]++;
    if(seq[q].length<JMAX)seq[q].push({k,x,y,c:m.c});
  }
  const out=[];
  seq.forEach((s,q)=>{
    if(!s.length)return;
    const fc=s[0].c;
    /* JTO[q] 的兩個方向只差沿右上對角線翻；用 oriFlip 決定（角上的第一子在右下半邊，掛角、締角從上邊來） */
    const mkT=t=>s.map(m=>{const[a,b]=symXY(m.x,m.y,19,t);return{a,b,c:m.c}});
    const t0=JTO[q][0],tk0=mkT(t0);
    const best=oriFlip(tk0.map(u=>(u.c===fc?"X":"O")+String.fromCharCode(97+u.a,97+u.b)),true)?{t:JTO[q][1],tk:mkT(JTO[q][1])}:{t:t0,tk:tk0};
    out.push({q,fc,t:best.t,
      str:best.tk.map(u=>(u.c===fc?"X":"O")+String.fromCharCode(97+u.a,97+u.b)).join(""),
      rstr:s.map(m=>m.c+String.fromCharCode(97+m.x,97+m.y)).join(""),
      ks:s.map(m=>m.k),p0:[s[0].x,s[0].y],more:cnt[q]>JMAX});
  });
  return out;
}
const rowMoves=m=>{const o=[];for(let k=0;k*2<m.length;k++){const p=m.substr(k*2,2);o.push({p:p==="--"?null:p,c:k%2===0?"B":"W"})}return o};

/* 盤に石を置き、呼吸点のなくなった石を取り除く（自殺手も取り除く） */
function placeStone(pat,p,c){
  const sz=19,ix=(x,y)=>y*sz+x,b=new Int8Array(sz*sz);
  pat.forEach(st=>{const[x,y]=xy(st.p);b[ix(x,y)]=st.c==="B"?1:2});
  const[X,Y]=xy(p),me=c==="B"?1:2;
  b[ix(X,Y)]=me;
  const nb=(x,y)=>{const o=[];if(x>0)o.push([x-1,y]);if(x<sz-1)o.push([x+1,y]);if(y>0)o.push([x,y-1]);if(y<sz-1)o.push([x,y+1]);return o};
  const seen=new Int32Array(sz*sz);let mark=0;
  const grp=(x,y)=>{
    const col=b[ix(x,y)],st=[[x,y]],out=[];let lib=false;mark++;seen[ix(x,y)]=mark;
    while(st.length){
      const[cx,cy]=st.pop();out.push([cx,cy]);
      for(const[nx,ny]of nb(cx,cy)){const j=ix(nx,ny);
        if(b[j]===0)lib=true;else if(b[j]===col&&seen[j]!==mark){seen[j]=mark;st.push([nx,ny])}}
    }
    return{out,lib};
  };
  let taken=0;
  for(const[nx,ny]of nb(X,Y)){
    const j=ix(nx,ny);
    if(b[j]&&b[j]!==me){const G=grp(nx,ny);if(!G.lib){G.out.forEach(([ax,ay])=>b[ix(ax,ay)]=0);taken+=G.out.length}}
  }
  const G=grp(X,Y);
  let suicide=false;
  if(!G.lib){G.out.forEach(([ax,ay])=>b[ix(ax,ay)]=0);suicide=true}
  const out=[];
  for(let y=0;y<sz;y++)for(let x=0;x<sz;x++){const v=b[ix(x,y)];if(v)out.push({p:String.fromCharCode(97+x,97+y),c:v===1?"B":"W"})}

}

let SEK=new Map();   /* 每一局：符合的那一手（檢視器從那一手開始） */
/* 一手一手照實戰下（會提子）。cb(b,k,x,y,cap,cnt) 回傳 true 就停下，回傳那一手的手數 */
function seSim(mv,lim,cb){
  const b=new Int8Array(361);let cnt=0;
  const nb=i=>{const x=i%19,y=(i/19)|0,o=[];if(x>0)o.push(i-1);if(x<18)o.push(i+1);if(y>0)o.push(i-19);if(y<18)o.push(i+19);return o};
  const grp=i=>{const c=b[i],st=[i],seen=new Set([i]);let lib=false;
    while(st.length){const j=st.pop();for(const k of nb(j)){if(!b[k])lib=true;else if(b[k]===c&&!seen.has(k)){seen.add(k);st.push(k)}}}
    return{seen,lib}};
  for(let k=0;k<lim;k++){
    const p=mv.substr(k*2,2);if(p==="--")continue;
    const[x,y]=xy(p);if(x<0||y<0||x>18||y>18)continue;
    const i=y*19+x,me=k%2===0?1:2;
    if(!b[i])cnt++;b[i]=me;let cap=false;
    for(const j of nb(i))if(b[j]&&b[j]!==me){const G=grp(j);if(!G.lib){G.seen.forEach(q=>{b[q]=0;cnt--});cap=true}}
    if(cb(b,k+1,x,y,cap,cnt))return k+1;
  }
  return 0;

/* 局部一致用：擺的子在 8 個方向（與黑白互換）下的寫法，以及「這一塊」（外圍 2 路，碰到盤邊就到邊為止）。
   形在第 4 路以內（靠近盤邊）的方向，和邊的距離也算在形裡，不能移動；離邊較遠的方向可以平移到盤上任何位置。
   ordered＝手順也要一樣（保留順序）；否則同樣的一組子只留一個 */
function seVariants(pts,swap,ordered){
  const out=[],seen=new Set(),m=S.seMargin;
  for(const sw of swap?[false,true]:[false])for(let t=0;t<8;t++){
    const st=pts.map(q=>{const[x,y]=xy(q.p),[a,b]=symXY(x,y,19,t);return{x:a,y:b,c:sw?(q.c==="B"?2:1):(q.c==="B"?1:2)}});
    const ks=st.map(s=>s.c+":"+s.x+","+s.y),k=(ordered?ks:ks.slice().sort()).join(";");
    if(seen.has(k))continue;seen.add(k);
    let x0=18,y0=18,x1=0,y1=0;st.forEach(s=>{x0=Math.min(x0,s.x);y0=Math.min(y0,s.y);x1=Math.max(x1,s.x);y1=Math.max(y1,s.y)});
    const r={x0:Math.max(0,x0-m),y0:Math.max(0,y0-m),x1:Math.min(18,x1+m),y1:Math.min(18,y1+m)};
    out.push({st,sw,r,
      dx:(x0<=3||x1>=15)?[0,0]:[-r.x0,18-r.x1],
      dy:(y0<=3||y1>=15)?[0,0]:[-r.y0,18-r.y1]});
  }
  return out;
}
function runSearch(rows){
  SEK=new Map();
  const n=S.pat.length;if(!n)return[];
  if(S.seMode!=="exact")S.seMode="local";
  const same=S.seOrd==="same"&&S.patSeq.length>0,out=[];
  if(S.seMode==="exact"){
    /* 全部一致：不旋轉、不翻轉，實戰某一手時的全盤和擺的一模一樣（棋譜都是黑第一手在右上） */
    const want=new Int8Array(361);S.pat.forEach(q=>{const[x,y]=xy(q.p);want[y*19+x]=q.c==="B"?1:2});
    const seq=S.patSeq.map(q=>q.c+q.p),L=seq.length;
    for(const row of rows){
      const mv=row.m;let k=0;
      if(same){
        /* 開局就照擺的順序下 */
        let ok=L<=mv.length>>1;
        for(let i=0;ok&&i<L;i++){if((i%2===0?"B":"W")+mv.substr(i*2,2)!==seq[i])ok=false}
        if(ok)k=L;
      }else{
        k=seSim(mv,Math.min(S.seDepth,mv.length>>1),(b,kk,x,y,cap,cnt)=>{
          if(cnt!==n)return false;
          for(let i=0;i<361;i++)if(b[i]!==want[i])return false;
          return true;
        });
      }
      if(k){SEK.set(row,k);out.push(row)}
    }
  }else{
    /* 局部一致：先用「這些子都下過」很快地找出可能的位置（方向＋平移），再一手一手確認 */
    const vs=seVariants(same?S.patSeq:S.pat,S.seSwap,same);
    const occ=new Uint8Array(361);
    for(const row of rows){
      const mv=row.m,lim=Math.min(S.seDepth,mv.length>>1);
      occ.fill(0);const mvIdx=[];
      for(let k=0;k<lim;k++){const p=mv.substr(k*2,2);if(p==="--")continue;const[x,y]=xy(p);if(x<0||y<0||x>18||y>18)continue;const i=y*19+x,c=k%2===0?1:2;occ[i]|=c;mvIdx.push(i,c)}
      let hit=0,hitSw=false;
      for(const v of vs){
        const s0=v.st[0],tried=new Set();
        for(let j=0;j<mvIdx.length&&!hit;j+=2){

          const dx=mvIdx[j]%19-s0.x,dy=((mvIdx[j]/19)|0)-s0.y;
          if(dx<v.dx[0]||dx>v.dx[1]||dy<v.dy[0]||dy>v.dy[1])continue;
          const tk=dx*64+dy;if(tried.has(tk))continue;tried.add(tk);
          let ok=true;for(const s of v.st){if(!(occ[(s.y+dy)*19+s.x+dx]&s.c)){ok=false;break}}
          if(!ok)continue;
          const r={x0:v.r.x0+dx,y0:v.r.y0+dy,x1:v.r.x1+dx,y1:v.r.y1+dy};
          if(same){
            /* 這一塊裡下的手，從第一手開始就要照擺的順序；別處的手（脫先）不管 */
            let i=0,k=0,good=true;
            for(;k<lim&&i<v.st.length;k++){
              const p=mv.substr(k*2,2);if(p==="--")continue;
              const[x,y]=xy(p);if(x<r.x0||x>r.x1||y<r.y0||y>r.y1)continue;
              const s=v.st[i];if(x!==s.x+dx||y!==s.y+dy||(k%2===0?1:2)!==s.c){good=false;break}

          }else{
            const want=new Map();v.st.forEach(s=>want.set((s.y+dy)*19+s.x+dx,s.c));
            hit=seSim(mv,lim,(b,kk,x,y,cap)=>{

              for(let yy=r.y0;yy<=r.y1;yy++)for(let xx=r.x0;xx<=r.x1;xx++){const q=yy*19+xx;if(b[q]!==(want.get(q)||0))return false}
              return true;
            });
          }
          if(hit)hitSw=v.sw;
        }
        if(hit)break;
      }
      if(hit){const o=hitSw?{...row,_sw:true}:row;SEK.set(o,hit);out.push(o)}
    }
  }
  out.sort((a,b)=>(b.d||"").localeCompare(a.d||""));
  return out;
}

async function openFound(row,side){
  if(!row)return;
  const name=side==="w"?row.w:row.b;
  if(row.gid!=null&&normName(S.subject)===normName(name)){openGame(row.gid,1);return}
  busy("載入對局…");
  if(MODE==="data"){
    const ok=await loadPlayer(name);
    if(!ok){
      if(S.page==="se"){renderSE();return}
      const el=document.getElementById("page-"+S.page);
      if(el){
        el.innerHTML=`<section class="panel"><div class="panel-h"><h2>沒有載入成功</h2></div><p class="sub">${esc(LOADERR||"載入棋譜失敗。")}</p><p style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="more" style="width:auto" id="ofRetry">再試一次</button><button class="more" style="width:auto" id="ofBack">回到上一頁</button></p></section>`;
        document.getElementById("ofRetry").onclick=()=>openFound(row,side);
        document.getElementById("ofBack").onclick=()=>go(S.page);
      }
      return;
    }
  }else S.subject=name;
  S.game=null;resetLists();rebuild();saveLS();syncHeader();
  const g=GAMES.find(x=>x.dt===row.d&&normName(side==="w"?x.raw.pb:x.raw.pw)===normName(side==="w"?row.b:row.w));
  if(g)openGame(g.id,1);else go("ov");
}

function goPhase(p){
  if(p===0){S.fuTab="recent";S.fuSel=null;S.fuStep=null;S.rcF=null;S.fuMore=3;go("fu");return}

  const worst=[...L].sort((a,b)=>(b.loss[p]||0)-(a.loss[p]||0))[0];

}

function wrSVG(g,n,ph){

  [CFG.p1,CFG.p2].forEach(k=>{if(k<g.len)h+=`<text x="${X(k)}" y="${H-5}" text-anchor="middle" font-size="10" fill="var(--faint)" font-family="IBM Plex Mono,monospace">${k}</text>`});

    h+=`<polyline points="${g.wr.map((v,k)=>X(k)+","+Y(v)).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="1.5"/>`;

  h+=`<line x1="${X(n)}" x2="${X(n)}" y1="${pt}" y2="${H-pb}" stroke="var(--ink)" stroke-width="1"/>`;

     sgfToRec(text[, opts])  → {rec, warn:[…]}

     SETUP（AB/AW/AE 擺子）、NO_NAME、NO_DATE、ENCODING（姓名出現亂碼）、EMPTY（沒有著手）、
     NO_ANALYSIS（沒有任何一手有 C[{"s":…}]）。其他可轉換但需要注意的情況都放在 warn。

     d 日期 YYYY-MM-DD、b/w 姓名、br/wr 段位、e 棋戰（GN）、r 結果（RE 原樣）、k 貼目（KM 原樣）

/* 各 shard（陣列，索引＝shard 編號，每個元素是該 shard 的 g 陣列）去重後合併成一個全體順序。
   每局最多出現在兩個 shard（黑方的、白方的），各 shard 內的先後一定保留（拓撲合併）；
   可以自由選的時候，依 open.json 裡的位置（＝all.jsonl 的順序）→ 日期 → 先讀到的。
   open 可省略（只用日期）。回傳 shard record 的陣列（同一個物件，不複製）。 */
function rbCollect(shards,open){
  const id=new Map(),recs=[],occ=[],inC=[],chains=[];
  for(let s=0;s<shards.length;s++){
    const L=shards[s];if(!L)continue;
    const ch=[],seen=new Set();
    for(const r of L){
      const k=rbKey(r);let g=id.get(k);
      if(g===undefined){g=recs.length;id.set(k,g);recs.push(r);occ.push(0);inC.push([])}
      if(seen.has(g))continue;seen.add(g);inC[g].push(chains.length);ch.push(g);occ[g]++;
    }
    chains.push(ch);
  }
  const N=recs.length,BIG=1e15,pos=new Float64Array(N).fill(BIG);
  if(open&&open.g&&open.p){
    const op=new Map();
    open.g.forEach((row,i)=>{const k=row[0]+"|"+open.p[row[1]]+"|"+open.p[row[2]]+"|"+String(row[4]).slice(0,60);if(!op.has(k))op.set(k,i)});
    for(let g=0;g<N;g++){const p=op.get(rbKey(recs[g]));if(p!==undefined)pos[g]=p}
  }
  const less=(a,b)=>pos[a]!==pos[b]?pos[a]<pos[b]:recs[a].d!==recs[b].d?recs[a].d<recs[b].d:a<b;
  const heap=[];
  const push=g=>{heap.push(g);let i=heap.length-1;while(i>0){const p=(i-1)>>1;if(!less(heap[i],heap[p]))break;const t=heap[i];heap[i]=heap[p];heap[p]=t;i=p}};
  const pop=()=>{const top=heap[0],last=heap.pop();if(heap.length){heap[0]=last;let i=0;for(;;){const l=2*i+1,r=l+1;let m=i;if(l<heap.length&&less(heap[l],heap[m]))m=l;if(r<heap.length&&less(heap[r],heap[m]))m=r;if(m===i)break;const t=heap[i];heap[i]=heap[m];heap[m]=t;i=m}}return top};
  const head=new Int32Array(chains.length),cnt=new Int32Array(N),done=new Uint8Array(N),out=[];
  const arrive=c=>{const ch=chains[c];while(head[c]<ch.length&&done[ch[head[c]]])head[c]++;if(head[c]<ch.length){const h=ch[head[c]];if(++cnt[h]===occ[h])push(h)}};
  for(let c=0;c<chains.length;c++)arrive(c);
  while(out.length<N){
    let g;
    if(heap.length){g=pop();if(done[g])continue}
    else{ /* shard 之間順序矛盾（正常不會發生）：從各 shard 的開頭挑最前面的一局硬放 */
      g=-1;for(let c=0;c<chains.length;c++){const ch=chains[c];if(head[c]<ch.length){const h=ch[head[c]];if(!done[h]&&(g<0||less(h,g)))g=h}}
      if(g<0)break;
    }
    done[g]=1;out.push(recs[g]);
    for(const c of inC[g]){const ch=chains[c];if(head[c]<ch.length&&ch[head[c]]===g){head[c]++;arrive(c)}}
  }
  return out;
}

/* rank.py：棋士ごとの全期間集計 → {min,std,mth,n,k,p}。games＝shard record の配列（rank.py と同じ順序なら完全一致） */
function rbRankBase(games){
  const D=rbDec(),MIN=1,P1=50,P2=150,HALF=[0,10,20,30,40],NB=5,KBAND=40,MTH=[3,5,8,10,15,20,30,50],NT=MTH.length;
  /* dec2(s[i:i+2])：2 文字そろわない・アルファベット外は None、100.0 を超えたら None */
  const dec2=(s,i)=>{if(s.length<i+2)return null;const a=D[s.charCodeAt(i)],b=D[s.charCodeAt(i+1)];if(!(a>=0&&b>=0))return null;const v=(a*64+b)/10;return v>100?null:v};
  const z3=()=>[0,0,0];
  const blank=()=>{const o={g:0,w:0,d:0,ls:z3(),lc:z3(),as:z3(),a3:z3(),ac:z3(),s1:z3(),s3:z3(),sc:z3(),bs:[],bc:[],mt:[],mc:z3(),kt:[],kc:z3()};
    for(let b=0;b<=NB;b++){o.bs.push(z3());o.bc.push(z3())}for(let t=0;t<NT;t++){o.mt.push(z3());o.kt.push(z3())}return o};
  const st=new Map(),get=nm=>{let s=st.get(nm);if(!s){s=blank();st.set(nm,s)}return s};
  for(const g of games){
    const mw=/^([BW])\s*\+/i.exec(String(g.r==null?"":g.r).trim()),winner=mw?mw[1].toUpperCase():null;
    const n=g.n,q=g.q,a=g.a,v=g.v,sr=g.sr==null?"":g.sr;
    const V=new Array(n),BW=new Array(n),PW=new Array(n);
    for(let k=0;k<n;k++){V[k]=dec2(v,k*2);BW[k]=dec2(a,k*12+2);PW[k]=dec2(a,k*12+10)}
    for(let side=0;side<2;side++){
      const color=side===0?"B":"W",s=get(side===0?g.b:g.w);
      s.g+=1;
      if(winner===null)s.d+=1;else if(winner===color)s.w+=1;
      const mine=side,blk=side===0;
      for(let k=mine;k<n;k+=2){
        if(k>=q.length||q[k]===".")continue;
        const p=k+1<=P1?0:k+1<=P2?1:2,pre=V[k],post=k+1<n?V[k+1]:null,dq=D[q.charCodeAt(k)];
        s.ac[p]+=1;
        if(dq===1)s.as[p]+=1;
        if(dq>=0&&dq<=3)s.a3[p]+=1;
        if(k<sr.length&&sr[k]!=="."){const t=Number(sr[k]);s.sc[p]+=1;if(t===1)s.s1[p]+=1;if(t>=1&&t<=3)s.s3[p]+=1}
        if(pre!==null&&post!==null){
          const drop=blk?pre-post:post-pre;
          s.mc[p]+=1;
          for(let t=0;t<NT;t++)if(drop>=MTH[t])s.mt[t][p]+=1;
          if(Math.abs(pre-50)<=KBAND){s.kc[p]+=1;for(let t=0;t<NT;t++)if(drop>=MTH[t])s.kt[t][p]+=1}
        }
        if(BW[k]!==null&&PW[k]!==null){
          const lost=Math.max(0,blk?BW[k]-PW[k]:PW[k]-BW[k]);
          s.ls[p]+=lost;s.lc[p]+=1;
          if(pre!==null){
            const edge=Math.abs(pre-50);
            for(let b=1;b<NB;b++)if(edge<=HALF[b]){s.bs[b][p]+=lost;s.bc[b][p]+=1}
            if(edge>HALF[4]){s.bs[NB][p]+=lost;s.bc[NB][p]+=1}
          }
        }
      }
    }
  }
  /* sum＝整数の和（正確）、fsum＝浮動小数の和（Python 3.12 の sum と同じ補償加法） */
  const R=rbPyRound,f=(x,c,d)=>c?R(x/c,d):null,sum=x=>x[0]+x[1]+x[2],fsum=rbPySum;
  const keys=["name","g","win","lf","lm","le","la","af","am","ae","aa","mi","bi","af3","am3","ae3","aa3","sf","sm","se","sa","s3f","s3m","s3e","s3a"];
  for(let b=1;b<=NB;b++)keys.push("L"+b+"f","L"+b+"m","L"+b+"e","L"+b+"a","C"+b+"a");
  for(const t of MTH)keys.push("M"+t+"f","M"+t+"m","M"+t+"e","M"+t+"a","N"+t+"f","N"+t+"m","N"+t+"e","N"+t+"a","K"+t+"f","K"+t+"m","K"+t+"e","K"+t+"a");
  const rows=[],i3=MTH.indexOf(3),i10=MTH.indexOf(10);
  st.forEach((s,name)=>{
    if(s.g<MIN)return;
    const dec=s.g-s.d,lc=s.lc,ac=s.ac,sc=s.sc,mc=s.mc,kc=s.kc;
    const r=[name,s.g,dec?R(s.w/dec*100,1):null,
      f(s.ls[0],lc[0],3),f(s.ls[1],lc[1],3),f(s.ls[2],lc[2],3),f(fsum(s.ls),sum(lc),3),
      f(s.as[0]*100,ac[0],1),f(s.as[1]*100,ac[1],1),f(s.as[2]*100,ac[2],1),f(sum(s.as)*100,sum(ac),1),
      R(sum(s.mt[i3])/s.g,2),R(sum(s.mt[i10])/s.g,2),
      f(s.a3[0]*100,ac[0],1),f(s.a3[1]*100,ac[1],1),f(s.a3[2]*100,ac[2],1),f(sum(s.a3)*100,sum(ac),1),
      f(s.s1[0]*100,sc[0],1),f(s.s1[1]*100,sc[1],1),f(s.s1[2]*100,sc[2],1),f(sum(s.s1)*100,sum(sc),1),
      f(s.s3[0]*100,sc[0],1),f(s.s3[1]*100,sc[1],1),f(s.s3[2]*100,sc[2],1),f(sum(s.s3)*100,sum(sc),1)];
    for(let b=1;b<=NB;b++){const bs=s.bs[b],bc=s.bc[b];r.push(f(bs[0],bc[0],3),f(bs[1],bc[1],3),f(bs[2],bc[2],3),f(fsum(bs),sum(bc),3),sum(bc))}
    for(let t=0;t<NT;t++){
      const c=s.mt[t];
      r.push(f(c[0]*100,mc[0],4),f(c[1]*100,mc[1],4),f(c[2]*100,mc[2],4),f(sum(c)*100,sum(mc),4),
        R(c[0]/s.g,3),R(c[1]/s.g,3),R(c[2]/s.g,3),R(sum(c)/s.g,3));
      const e=s.kt[t];
      r.push(f(e[0]*100,kc[0],2),f(e[1]*100,kc[1],2),f(e[2]*100,kc[2],2),f(sum(e)*100,sum(kc),2));
    }
    rows.push(r);
  });
  rows.sort((x,y)=>y[1]-x[1]);   /* 安定ソート（ES2019）＝ Python の sort(key=-g) */
  return{min:MIN,std:{p1:P1,p2:P2},mth:MTH,n:rows.length,k:keys,p:rows};
}

/* q_gen.js：扣除對手強度的 10 欄（Rt,T1x,Wx,OPx,MGx,EGx,EGt,EGq,θT1,θW）與 rank.qf。
   Q＝{QF,qfGame,QFS,qfPair,qfPerf}（瀏覽器裡就是頁面 @@QF 區塊的全域函式）。gen 省略時＝今天（UTC，與 q_gen.js 相同）。
   回傳 {cols:{棋士名→[10 個值]}, qf:{gen,mu,anchor,eg,cv}, info:{cg,sweeps,maxChange}} */
function rbQF(games,Q,gen){
  /* 同名二人の対局は除く（q_gen.js・qfVals と同じ） */
  const G=[];for(const r of games)if(r.b!==r.w)G.push({b:r.b,w:r.w,win:rbWinner(r.r),mv:rbDecode(r)});
  const F=G.map(g=>Q.qfGame(g.mv));
  const names=new Set();G.forEach(g=>{names.add(g.b);names.add(g.w)});
  const info={cg:{}};
  /* 對手補正（pair）：(Lap_w + λI)(θ−μ) = b を CG で解く */
  function solve(key,mu){
    const lam=Q.QF.lam[key],id=new Map(),ix=n=>{if(!id.has(n))id.set(n,id.size);return id.get(n)};
    const E=[];
    G.forEach((g,i)=>{const p=Q.qfPair(F[i],"B",key);if(p)E.push([ix(g.b),ix(g.w),p[0],p[1]])});
    const n=id.size,Dg=new Float64Array(n).fill(lam),b=new Float64Array(n);
    for(const[a,c,d,w]of E){Dg[a]+=w;Dg[c]+=w;b[a]+=w*d;b[c]-=w*d}
    const mul=(x,y)=>{for(let i=0;i<n;i++)y[i]=Dg[i]*x[i];for(const[a,c,,w]of E){y[a]-=w*x[c];y[c]-=w*x[a]}};
    const x=new Float64Array(n),r=Float64Array.from(b),p=Float64Array.from(r),Ap=new Float64Array(n);
    let rr=r.reduce((s,v)=>s+v*v,0);const b2=rr||1;let it=0;
    for(;it<20000&&rr>1e-26*b2;it++){
      mul(p,Ap);let pAp=0;for(let i=0;i<n;i++)pAp+=p[i]*Ap[i];const al=rr/pAp;
      for(let i=0;i<n;i++){x[i]+=al*p[i];r[i]-=al*Ap[i]}
      const rn=r.reduce((s,v)=>s+v*v,0),be=rn/rr;rr=rn;for(let i=0;i<n;i++)p[i]=r[i]+be*p[i];
    }
    const th=new Map();for(const[nm,i]of id)th.set(nm,x[i]+mu);
    info.cg[key]={games:E.length,players:n,it};
    return th;
  }
  /* 各棋士の生の値（手数で加重）。rawMu・anchor で使う */
  function rawOf(key){
    const s=new Map();
    G.forEach((g,i)=>{for(const c of["B","W"]){const v=Q.QFS[key](F[i][c]);if(!v)continue;const nm=c==="B"?g.b:g.w,e=s.get(nm)||[0,0];e[0]+=v[0]*v[1];e[1]+=v[1];s.set(nm,e)}});
    return s;
  }
  function rawMu(key){let m=0,k=0;rawOf(key).forEach(e=>{if(e[1]){m+=e[0]/e[1];k++}});return m/k}
  const byP=new Map();G.forEach((g,i)=>{for(const nm of[g.b,g.w]){if(!byP.has(nm))byP.set(nm,[]);byP.get(nm).push(i)}});
  /* live（アプリと同じ式）：Σw(d+θ對手)/(Σw+λlive) */
  function live(key,th){
    const out=new Map(),ll=Q.QF.live[key];
    byP.forEach((ix,nm)=>{let a=0,c=0;for(const i of ix){const g=G[i],me=g.b===nm?"B":"W",op=me==="B"?g.w:g.b,t=th.get(op);if(t==null)continue;const p=Q.qfPair(F[i],me,key);if(!p)continue;a+=p[1]*(p[0]+t);c+=p[1]}
      if(c)out.set(nm,a/(c+ll))});
    return out;
  }
  const mu={T1:rawMu("T1"),W:rawMu("W")};
  const TH={T1:solve("T1",mu.T1),W:solve("W",mu.W),OP:solve("OP",0),MG:solve("MG",0),EGt:solve("EGt",0),EGq:solve("EGq",0)};
  const V={};for(const k of Object.keys(TH))V[k]=live(k,TH[k]);
  const nG=new Map();byP.forEach((ix,nm)=>nG.set(nm,ix.length));
  const anchor={};
  /* T1・W：20 局以上の棋士で「補正後の平均＝生の値の平均」になるよう定数をずらす */
  for(const key of["T1","W"]){
    const raw=rawOf(key);
    let a=0,b=0,k=0;V[key].forEach((x,nm)=>{const e=raw.get(nm);if(nG.get(nm)>=20&&e&&e[1]){a+=e[0]/e[1];b+=x;k++}});
    anchor[key]=(a-b)/k;V[key].forEach((x,nm)=>V[key].set(nm,x+anchor[key]));
  }
  /* EGt・EGq：表示用の基準だけ（θ は変えない） */
  for(const key of["EGt","EGq"]){
    const raw=rawOf(key);
    let a=0,b=0,k=0;V[key].forEach((x,nm)=>{const e=raw.get(nm);if(nG.get(nm)>=20&&e&&e[1]){a+=e[0]/e[1];b+=x;k++}});
    anchor[key]=(a-b)/k;
  }
  /* 等級分：qfPerf の Gauss–Seidel。最大変化が 1e-11 未満で止める。
     各棋士の [對手, 勝敗] の並びは q_gen.js の resOf と同じ順で前もって作り、對手の値だけ毎回入れ替える（計算は同一） */
  const NM=[...names],pid=new Map();NM.forEach((n,i)=>pid.set(n,i));
  const Rv=new Float64Array(NM.length),RES=NM.map(nm=>{
    if(!byP.has(nm))return null;const opp=[],res=[];
    for(const i of byP.get(nm)){const g=G[i];if(!g.win)continue;const me=g.b===nm?"B":"W";opp.push(pid.get(me==="B"?g.w:g.b));res.push([0,g.win===me?1:0])}
    return[opp,res]});
  let sweep=0,mx=1;
  for(;sweep<5000&&mx>1e-11;sweep++){
    mx=0;
    for(let i=0;i<NM.length;i++){
      const e=RES[i];if(!e)continue;
      const opp=e[0],res=e[1];for(let j=0;j<opp.length;j++)res[j][0]=Rv[opp[j]];
      const r=Q.qfPerf(res);mx=Math.max(mx,Math.abs(r-Rv[i]));Rv[i]=r;
    }
  }
  const R=new Map();NM.forEach((n,i)=>R.set(n,Rv[i]));
  info.sweeps=sweep;info.maxChange=mx;
  const hasRes=nm=>{const e=RES[pid.get(nm)];return !!(e&&e[0].length)};   /* 勝負のついた對局がない棋士は等級分なし */
  {let a=0,k=0;R.forEach((r,nm)=>{if(nG.get(nm)>=20&&hasRes(nm)){a+=1500+r*400/Math.LN10;k++}});anchor.Rt=1500-a/k}
  const elo=r=>1500+anchor.Rt+r*400/Math.LN10;
  /* 官子＝z(EGt)+z(EGq) の偏差値。μ・σ は 20 局以上の棋士 */
  const stt=key=>{const v=[];V[key].forEach((x,nm)=>{if(nG.get(nm)>=20)v.push(x)});const m=v.reduce((a,b)=>a+b,0)/v.length;return[m,Math.sqrt(v.reduce((a,b)=>a+(b-m)**2,0)/v.length)]};
  const[mt,sdt]=stt("EGt"),[mq,sdq]=stt("EGq");
  const comp=nm=>{const a=V.EGt.get(nm),b=V.EGq.get(nm);return a==null||b==null?null:(a-mt)/sdt+(b-mq)/sdq};
  const cv=[];names.forEach(nm=>{if(nG.get(nm)>=20){const c=comp(nm);if(c!=null)cv.push(c)}});
  const cm=cv.reduce((a,b)=>a+b,0)/cv.length,csd=Math.sqrt(cv.reduce((a,b)=>a+(b-cm)**2,0)/cv.length);
  const rd=(v,d)=>v==null||!isFinite(v)?null:Math.round(v*10**d)/10**d;
  const cols=Object.create(null);
  names.forEach(nm=>{
    const c=comp(nm);
    cols[nm]=[rd(R.has(nm)&&byP.has(nm)&&hasRes(nm)?elo(R.get(nm)):null,2),rd(V.T1.has(nm)?V.T1.get(nm)*100:null,4),rd(V.W.has(nm)?-V.W.get(nm):null,4),
      rd(V.OP.get(nm),4),rd(V.MG.get(nm),4),rd(c==null?null:50+10*(c-cm)/csd,3),rd(V.EGt.get(nm),6),rd(V.EGq.get(nm),6),rd(TH.T1.get(nm),6),rd(TH.W.get(nm),6)];
  });
  return{cols,qf:{gen:gen||new Date().toISOString().slice(0,10),mu,anchor,eg:{mt,sdt,mq,sdq,cm,csd},
    /* 5 分割交差検証の正解率（q_gen.js の定数をそのまま） */
    cv:{Rt:65.3,T1x:65.1,MGx:64.8,Wx:64.6,EGx:61.6,OPx:60.6,s3a:63.5,sa:63.2,K10a:62.2,s3e:59.3,win:59.9}},info};
}

/* rank.json 全体＝rank.py の列＋q_gen.js の 10 列（現行 rank.json と同じ列順）。gen は rank.qf.gen */
function rbRank(games,Q,gen){
  const base=rbRankBase(games),qf=rbQF(games,Q,gen);
  const NEW=["Rt","T1x","Wx","OPx","MGx","EGx","EGt","EGq","θT1","θW"],nul=NEW.map(()=>null);
  return{min:base.min,std:base.std,mth:base.mth,n:base.n,k:base.k.concat(NEW),
    p:base.p.map(r=>r.concat(qf.cols[r[0]]||nul)),qf:qf.qf};
}

/* openidx.py：前 50 手（m の先頭 100 文字）。20 文字未満は入れない。
   rbOpenAppend は既存の名前の番号を変えず、新しい名前を末尾に足す */
function rbOpenAppend(open,newRecs){
  const K=open.k||50,p=open.p.slice(),g=open.g.slice(),ni=new Map();
  p.forEach((n,i)=>{if(!ni.has(n))ni.set(n,i)});
  const idx=n=>{if(!ni.has(n)){ni.set(n,p.length);p.push(n)}return ni.get(n)};
  for(const r of newRecs){
    const m=r.m.slice(0,K*2);
    if(m.length<20)continue;
    g.push([r.d,idx(r.b),idx(r.w),r.r,m]);
  }
  return Object.assign({},open,{n:g.length,k:K,p,g});
}
function rbOpen(games){return rbOpenAppend({n:0,k:50,p:[],g:[]},games)}

/* shard.py の増量版。既存の棋士は今の shard のまま。新しい棋士は（新局数の多い順・名前順に）
   「今のサイズ＋この棋士の局の大きさ ≤ 520000 バイト」の最初の shard へ、どこにも入らなければ新しい shard（番号＝index.shards）。
   新しい局は黒の shard と白の shard（違えば両方）の末尾に足す。
   index：現行 index.json、shardSizes：各 shard ファイルの現在のバイト数（不明は入れない扱い）、
   newRecs：追加する局（既存との重複は呼ぶ側が rbKey で除くこと。同じバッチ内の重複はここでも除く）、
   regionOf(name)：新しい棋士の地域（"KR","CN","TW","JP"…、不明なら "ZZ"）、gen：index.gen（省略＝今日）。
   回傳 {index, touched:[内容が変わる shard], add:{shard:[recs]}, sizes:[予想サイズ], placed:{新棋士:shard}, dup:[除いた局]} */
function rbPlace(index,shardSizes,newRecs,regionOf,gen){
  const MAXB=520000,EMPTY=8;   /* EMPTY＝'{"g":[]}' */
  const shardOf=new Map();index.players.forEach(p=>shardOf.set(p[0],p[2]));
  let S=index.shards;
  const sizes=[];for(let s=0;s<S;s++){const v=shardSizes&&shardSizes[s];sizes.push(typeof v==="number"&&isFinite(v)?v:Infinity)}
  const recs=[],dup=[],seen=new Set();
  for(const r of newRecs){const k=rbKey(r);if(seen.has(k)){dup.push(r);continue}seen.add(k);recs.push(r)}
  const len=recs.map(r=>rbUtf8Len(JSON.stringify(r)));
  const plan=[];   /* plan[s]＝Set(recs の番号) */
  const has=(s,i)=>plan[s]&&plan[s].has(i);
  const put=(s,i)=>{if(!plan[s])plan[s]=new Set();if(plan[s].has(i))return;plan[s].add(i);sizes[s]+=len[i]+(sizes[s]>EMPTY?1:0)};
  /* 局数（shard.py：同名の二人の対局は 1 回） */
  const cnt=new Map(),mine=new Map();
  recs.forEach((r,i)=>{for(const nm of r.w===r.b?[r.b]:[r.b,r.w]){cnt.set(nm,(cnt.get(nm)||0)+1);if(!shardOf.has(nm)){if(!mine.has(nm))mine.set(nm,[]);mine.get(nm).push(i)}}});
  /* 1) 既存の棋士の局 */
  recs.forEach((r,i)=>{for(const nm of[r.b,r.w])if(shardOf.has(nm))put(shardOf.get(nm),i)});
  /* 2) 新しい棋士：first-fit */
  const fresh=[...mine.keys()].sort((a,b)=>mine.get(b).length-mine.get(a).length||rbPyCmp(a,b));
  const placed={};
  for(const nm of fresh){
    const ids=mine.get(nm);
    const need=s=>{let z=sizes[s],any=z>EMPTY;for(const i of ids)if(!has(s,i)){z+=len[i]+(any?1:0);any=true}return z};
    let to=-1;for(let s=0;s<S;s++)if(need(s)<=MAXB){to=s;break}
    if(to<0){to=S++;sizes.push(EMPTY)}
    for(const i of ids)put(to,i);
    shardOf.set(nm,to);placed[nm]=to;
  }
  /* add は newRecs の順（各 shard の中の順序＝全体の順序を保つ） */
  const add={},touched=[];
  for(let s=0;s<plan.length;s++)if(plan[s]&&plan[s].size){add[s]=recs.filter((r,i)=>plan[s].has(i));touched.push(s)}
  const players=index.players.map(p=>{const q=p.slice();if(cnt.has(p[0]))q[1]=p[1]+cnt.get(p[0]);return q});
  for(const nm of fresh){const rg=typeof regionOf==="function"?regionOf(nm):null;players.push([nm,cnt.get(nm),shardOf.get(nm),rg||"ZZ"])}
  players.sort((a,b)=>b[1]-a[1]||rbPyCmp(a[0],b[0]));
  const out=Object.assign({},index,{gen:gen||rbToday(),n:index.n+recs.length,shards:S,players});
  return{index:out,touched,add,sizes,placed,dup,recs};
}

/* まとめて：今のデータ（index・shards・open）に新しい局を足して、書き出すもの全部を作る。
   state＝{index, shards:[g 配列…]（全 shard）, open}、shardSizes 省略時は shards から計算。
   回傳 {added, dupExisting, dupBatch, index, shards:{番号:新しい g 配列}, open, rank, info} */
function rbApply(state,newRecs,Q,opts){
  opts=opts||{};
  /* shard がひとつでも欠けていると、その shard を新しい局だけで上書きしてしまう：必ず全部そろえてから呼ぶ */
  for(let s=0;s<state.index.shards;s++)if(!Array.isArray(state.shards[s]))throw new Error("資料庫的第 "+s+" 個檔案沒有讀到，已停止（不會寫入任何東西）。請重新整理後再試。");
  const gen=opts.gen||rbToday();   /* index.gen と rank.qf.gen を同じ日付に */
  const have=new Set();state.shards.forEach(L=>{if(L)for(const r of L)have.add(rbKey(r))});
  const fresh=[],dupExisting=[];for(const r of newRecs)(have.has(rbKey(r))?dupExisting:fresh).push(r);
  const sizes=opts.shardSizes||state.shards.map(L=>L?rbUtf8Len(JSON.stringify({g:L})):Infinity);
  const pl=rbPlace(state.index,sizes,fresh,opts.regionOf,gen);
  const shards=state.shards.slice(),changed={};
  for(const s of pl.touched){shards[s]=(shards[s]||[]).concat(pl.add[s]);changed[s]=shards[s]}
  const added=pl.recs;   /* 同じ局を二回渡されても一回だけ（rbPlace の重複除去と同じ結果） */
  const open=rbOpenAppend(state.open,added);
  const games=opts.noRank?null:rbCollect(shards,open);   /* noRank：分次儲存的中間幾次不重算排名（最後一次再算） */
  const t0=Date.now(),rank=opts.noRank?null:rbRank(games,Q,gen);
  return{added,dupExisting,dupBatch:pl.dup,index:pl.index,shards:changed,sizes:pl.sizes,placed:pl.placed,open,rank,info:{games:games?games.length:null,rankMs:Date.now()-t0}};
}
/* 刪除：從今天的資料（index・shards・open）拿掉指定的局（keys＝rbKey 的陣列），產生要寫出的東西。
   局數變成 0 的棋士從 index 拿掉（shard 檔不搬家，其他棋士不受影響）。open.json 裡同一個鍵的列也拿掉。
   回傳 {removed:[拿掉的 record，每局一次，依 shard 裡的順序], missing:[找不到的鍵], gone:[整個消失的棋士（index 的列）],
         index, shards:{番號:新的 g 陣列}, open, rank, info}。opts＝{gen, noRank}（和 rbApply 相同） */
function rbRemove(state,keys,Q,opts){
  opts=opts||{};
  for(let s=0;s<state.index.shards;s++)if(!Array.isArray(state.shards[s]))throw new Error("資料庫的第 "+s+" 個檔案沒有讀到，已停止（不會寫入任何東西）。請重新整理後再試。");
  const gen=opts.gen||rbToday(),del=new Set(keys),found=new Map();
  const shards=state.shards.slice(),changed={};
  for(let s=0;s<shards.length;s++){
    const L=shards[s];if(!L)continue;
    let hit=false;const keep=[];
    for(const r of L){const k=rbKey(r);if(del.has(k)){hit=true;if(!found.has(k))found.set(k,r)}else keep.push(r)}
    if(hit){shards[s]=keep;changed[s]=keep}
  }
  const removed=[...found.values()],missing=[...del].filter(k=>!found.has(k));
  /* 局數（shard.py：同名的兩人對局算 1 次） */
  const cnt=new Map();for(const r of removed)for(const nm of r.w===r.b?[r.b]:[r.b,r.w])cnt.set(nm,(cnt.get(nm)||0)+1);
  const players=[],gone=[];
  for(const p of state.index.players){const c=cnt.get(p[0])||0;if(!c){players.push(p);continue}if(p[1]-c>0){const q=p.slice();q[1]=p[1]-c;players.push(q)}else gone.push(p)}
  players.sort((a,b)=>b[1]-a[1]||rbPyCmp(a[0],b[0]));
  const index=Object.assign({},state.index,{gen,n:state.index.n-removed.length,players});
  const o=state.open,og=o.g.filter(row=>!found.has(row[0]+"|"+o.p[row[1]]+"|"+o.p[row[2]]+"|"+String(row[4]).slice(0,60)));
  const open=Object.assign({},o,{n:og.length,g:og});
  const games=opts.noRank?null:rbCollect(shards,open);
  const t0=Date.now(),rank=opts.noRank?null:rbRank(games,Q,gen);
  return{removed,missing,gone,index,shards:changed,open,rank,info:{games:games?games.length:null,rankMs:Date.now()-t0}};
}
/* @@RB-END */

/* 資料檔的網址：index.json 的 fv 記錄每個檔案最後更新的戳記（上傳時更新），避免瀏覽器拿到舊的快取 */

  const fP=foldName(S.csP||""),fO=foldName(S.csO||""),ev=foldName(S.csE||""),f=S.csFrom||"",t=S.csTo||"",ub=S.csU||"all",rs=S.csR||"all";
  const bat=new Map((UPL?UPL.b:[]).map(b=>[b.id,b]));
  const out=[],only=ROLE.admin&&DEL.on&&DEL.only;
  const mk=(i,r,b,w)=>({i,d:r[0],b,w,r:r[3],e:CAT.ev[r[4]]||"",n:r[5],u:bat.get(r[6]),f:r[7]||""});
  for(let i=0;i<CAT.g.length;i++){
    const r=CAT.g[i];if(!Array.isArray(r))continue;
    const b=CAT.p[r[1]]||"",w=CAT.p[r[2]]||"";
    if(only){if(DEL.sel.has(i))out.push(mk(i,r,b,w));continue}   /* 刪除模式的「只看已勾選的」：不管搜尋條件 */
    if(f&&r[0]<f)continue;if(t&&r[0]>t)continue;
    if(ub==="up"&&!r[6])continue;if(ub!=="all"&&ub!=="up"&&String(r[6])!==ub)continue;

    if(fP||fO){const nb=foldName(b),nw=foldName(w);
      if(fP&&!(nb.indexOf(fP)>=0||nw.indexOf(fP)>=0))continue;
      if(fO){const side=fP?(nb.indexOf(fP)>=0?nw:nb):null;if(side!=null?side.indexOf(fO)<0:!(nb.indexOf(fO)>=0||nw.indexOf(fO)>=0))continue}}
    if(ev&&(CAT.evF[r[4]]||"").indexOf(ev)<0)continue;
    out.push(mk(i,r,b,w));

  out.sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:b.i-a.i);
  return out;
}

}

const dbNow=k=>{const t=new Date(),pad=n=>String(n).padStart(2,"0"),day=`${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`;
  return{day,at:`${day}T${pad(t.getHours())}:${pad(t.getMinutes())}`,stamp:k+day.replace(/-/g,"")+pad(t.getHours())+pad(t.getMinutes())+pad(t.getSeconds())}};
/* 發布：伺服器要求稍候時最多再試 3 次，其他錯誤丟給呼叫的人 */

function dbMem(R,nIndex,nCat,nUpl,shards){

/* 研究對象的對局重新讀一次；研究對象整個被刪掉時換成局數最多的棋士 */
async function dbAfter(){

/* 目錄的列 → shard 裡的那一局。同一天、同樣兩人、同樣結果和手數的對局有好幾局時，依出現的順序對應（目錄和 shard 的順序相同） */
function delMatch(idx,shards){
  const pm=new Map(INDEX.players.map(p=>[p[0],p[2]]));
  const tup=r=>[r[0],CAT.p[r[1]],CAT.p[r[2]],r[3]||"",CAT.ev[r[4]]||"",r[5]].join("|");
  const occ=new Map(),occOf=new Map();
  CAT.g.forEach((r,i)=>{if(!Array.isArray(r))return;const t=tup(r),k=occ.get(t)||0;occ.set(t,k+1);occOf.set(i,k)});
  const out=[],miss=[];
  for(const i of idx){
    const r=CAT.g[i];if(!Array.isArray(r)){miss.push(i);continue}
    const b=CAT.p[r[1]],w=CAT.p[r[2]],sid=pm.get(b),L=sid==null?null:shards[sid];
    if(!L){miss.push(i);continue}
    const seen=new Set(),cand=[];
    for(const x of L)if(x.d===r[0]&&x.b===b&&x.w===w&&(x.r||"")===(r[3]||"")&&(x.e||"")===(CAT.ev[r[4]]||"")&&x.n===r[5]){const k=rbKey(x);if(!seen.has(k)){seen.add(k);cand.push(x)}}
    const tot=occ.get(tup(r)),rec=cand.length===tot?cand[occOf.get(i)]:cand.length===1?cand[0]:null;

}
const delBlocked=()=>DEL.busy||UP.busy||UP.parsing>0||UP.chk>0;

async function delCommit(idx){

  DEL.busy=true;UP.busy=true;DEL.err="";DEL.msg="";delRefresh();
  const guard=e=>{e.preventDefault();e.returnValue="";return ""};window.addEventListener("beforeunload",guard);
  let done=0,parts=0,rankDirty=false;

  try{
    delSet("讀入資料庫…");
    const shards=await loadAllShards((d,n)=>delSet(`讀入資料庫… ${d}/${n}`));
    if(!OPENIDX)await loadOpenIdx();

    const uniq=[],seenK=new Set();M.out.forEach(x=>{if(!seenK.has(x.key)){seenK.add(x.key);uniq.push(x)}});
    const groups=upGroups(uniq),grp=Math.max(0,...UPL.b.map(b=>num0(b.id)))+1;
    for(let gi=0;gi<groups.length;gi++){

      const T=dbNow("d");T.stamp+="-"+gi;
      delSet(last?`重算全部棋士的排名${tag}（約 10 秒，畫面會暫停）…`:`準備第 ${gi+1}/${groups.length} 部分…`);
      await new Promise(r=>setTimeout(r,60));
